<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ADRAH — Assistance • Dépannage • Remorquage</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">


<style>


:root{

--blue:#005BFF;

--cyan:#00a2ff;

--glass:rgba(0,0,0,.55);

}



*{

box-sizing:border-box;

}



body{

margin:0;

min-height:100vh;

font-family:Inter,sans-serif;

color:white;


background-image:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,10,30,.55)
),
url("fond-adrah.PNG");


background-position:center top;

background-size:auto 100%;

background-repeat:no-repeat;

background-attachment:fixed;

}

html{

background:#05070b;

}

.app{

max-width:560px;

margin:auto;

padding:20px;

}



/* RECHERCHE */


.search input{

width:100%;

height:62px;


border-radius:22px;


border:2px solid var(--blue);


background:rgba(0,0,0,.6);


color:white;


font-size:18px;

font-weight:900;

text-align:center;


box-shadow:

0 0 10px var(--blue),

0 0 35px rgba(0,91,255,.6);



}


.search input::placeholder{

color:#9ed2ff;

}



/* TITRE */


h2{

font-size:15px;

color:#00a2ff;


text-shadow:

0 0 10px #005BFF;


}



/* GRILLE */


.grid{

display:grid;

gap:16px;

}



/* CARTES */


.card{


position:relative;


display:flex;

align-items:center;


gap:20px;


padding:22px;


min-height:120px;


border-radius:30px;



background:

linear-gradient(

135deg,

rgba(0,91,255,.2),

rgba(0,0,0,.65)

);



border:

1px solid rgba(0,162,255,.8);



backdrop-filter:blur(15px);



box-shadow:

0 0 15px rgba(0,91,255,.7),

0 0 40px rgba(0,91,255,.35),

inset 0 0 25px rgba(0,91,255,.15);



transition:.25s;


}



.card:hover{

transform:translateY(-4px);

}



.card i{


font-size:45px;


color:white;


text-shadow:

0 0 5px white,

0 0 15px #00a2ff,

0 0 35px #005BFF;


}



.card h3{


margin:0;


font-size:34px;


font-weight:900;


text-shadow:

0 0 5px white,

0 0 15px #00a2ff,

0 0 35px #005BFF;


}



.card span:not(.badge){

color:#00a2ff;

font-weight:900;


text-shadow:

0 0 10px #005BFF;

}



/* BADGE */


.badge{

position:absolute;

right:18px;

top:18px;


padding:7px 16px;


border-radius:50px;


border:1px solid #00a2ff;


background:rgba(0,91,255,.25);


box-shadow:

0 0 15px #005BFF;


font-weight:900;


}



/* RESULTATS */


#results{

margin-top:25px;

}



.row{


display:flex;

align-items:center;

justify-content:space-between;


padding:20px;


border-radius:25px;


margin-bottom:15px;


background:rgba(0,0,0,.55);


border:1px solid #005BFF;


box-shadow:

0 0 20px rgba(0,91,255,.5);


}



.title{


font-size:18px;

font-weight:900;


text-shadow:

0 0 15px #005BFF;


}



.sub{

margin-top:5px;

color:#8fd3ff;

font-weight:700;


}



.call{


width:55px;

height:55px;


border-radius:50%;


display:flex;

align-items:center;

justify-content:center;


background:#005BFF;


color:white;


font-size:25px;


box-shadow:

0 0 25px #005BFF;


text-decoration:none;


}



/* DRAWER */


.drawer{


position:fixed;


top:0;

right:0;


height:100%;


width:min(420px,95vw);


background:rgba(0,0,0,.9);


backdrop-filter:blur(20px);


border-left:2px solid #005BFF;


transform:translateX(100%);


transition:.3s;


z-index:999;


padding:25px;


overflow:auto;


}



.drawer.show{

transform:translateX(0);

}


.close{


background:#005BFF;

color:white;

border:0;

padding:10px;

border-radius:15px;

float:right;


}


.info span{

display:block;

color:#00a2ff;

font-weight:800;

margin-bottom:15px;


text-shadow:

0 0 10px #005BFF;


}


</style>


</head>


<body>


<div class="app">





<div class="search">

<input id="q" placeholder="Rechercher...">

</div>



<h2 id="secretTrigger">

CATÉGORIES

</h2>



<div class="grid" id="cats"></div>



<section id="results" style="display:none">


<h2 id="count"></h2>


<div id="list"></div>


</section>

  <!-- DRAWER DETAIL -->

<aside id="drawer" class="drawer">

<button class="close" id="closeDrawer">
✕
</button>



<h1 id="d-name"></h1>

<h3 id="d-cat"
style="
color:#00a2ff;
">
</h3>


<a id="d-call"
class="call"
style="
width:100%;
height:60px;
border-radius:20px;
margin:20px 0;
">

<i class="ph ph-phone"></i>

<span id="d-tel"></span>

</a>



<div class="info">


<b>Type</b>
<span id="d-type"></span>


<b>Assisteur</b>
<span id="d-assist"></span>


<b>Adresse</b>
<span id="d-address"></span>


<b>Email</b>
<span id="d-email"></span>


<b>Services</b>
<span id="d-services"></span>


</div>


</aside>



<script>


const CATEGORIES=[

{
key:"VL",
label:"VL",
sub:"Véhicule léger",
icon:"ph-car"
},

{
key:"PL",
label:"PL",
sub:"Poids lourd",
icon:"ph-truck"
},

{
key:"MOTO",
label:"MOTO",
sub:"Deux roues",
icon:"ph-motorcycle"
},

{
key:"LOCATION",
label:"LOCATION",
sub:"Location",
icon:"ph-key"
},

{
key:"ASSURANCE",
label:"ASSURANCE",
sub:"Assurance",
icon:"ph-shield"
},

{
key:"GARAGE",
label:"GARAGE",
sub:"Partenaires",
icon:"ph-wrench"
}

];



let DATA=[];

let current=[];



const cats=document.getElementById("cats");



cats.innerHTML=CATEGORIES.map(c=>`

<div class="card" data-cat="${c.key}">

<i class="ph ${c.icon}"></i>


<div>

<h3>${c.label}</h3>

<span>${c.sub}</span>

</div>


<span class="badge">

24/7

</span>


</div>

`).join("");





/* CHARGEMENT DES JSON */


Promise.allSettled([

fetch("data.json").then(r=>r.json()),

fetch("data2.json").then(r=>r.json()),

fetch("data3.json").then(r=>r.json()),

fetch("garage.json").then(r=>r.json())

])


.then(r=>{


DATA=[

...(r[0].value || []),

...(r[1].value || []),

...(r[2].value || []),

...(r[3].value || [])

];


DATA=DATA.map(x=>({

name:x.nom || x.name || "",

phone:String(
x.telephone || x.phone || ""
),

category:
(
x.categorie ||
x.category ||
""
).toUpperCase(),


type:x.type || "",


assistant:
x.assisteur ||
x.assistant ||
"",


adresse:x.adresse || "",


email:x.email || "",


services:x.services || "",


logo:x.logo || ""

}));


console.log(DATA);


});





/* RECHERCHE */


const q=document.getElementById("q");

const results=document.getElementById("results");

const list=document.getElementById("list");

const count=document.getElementById("count");



function render(rows){


current=rows;


if(!rows.length){

results.style.display="none";

return;

}



results.style.display="block";


count.textContent=

rows.length+

" résultat(s)";



list.innerHTML=rows.map((r,i)=>`

<div class="row"
data-i="${i}">


<div>


<div class="title">

${r.name}

</div>


<div class="sub">

${r.category}
${r.assistant ? " · "+r.assistant:""}

</div>


</div>



<a class="call"
href="tel:${r.phone}">

<i class="ph ph-phone"></i>

</a>


</div>


`).join("");

}




function search(text){


let n=text.toLowerCase().trim();



if(!n){

results.style.display="none";

return;

}



let rows=DATA.filter(x=>{


return [

x.name,

x.phone,

x.category,

x.type,

x.assistant,

x.services

]

.join(" ")

.toLowerCase()

.includes(n);


});



render(rows);


}



q.addEventListener("input",e=>{

search(e.target.value);

});






/* CLIC CATEGORIES */


cats.addEventListener("click",e=>{


let card=e.target.closest(".card");


if(!card)return;



let key=card.dataset.cat;



let rows=DATA.filter(x=>

x.category===key ||

x.type===key

);



render(rows);



});






/* DRAWER */


const drawer=document.getElementById("drawer");



list.addEventListener("click",e=>{


if(e.target.closest(".call"))

return;



let row=e.target.closest(".row");


if(!row)return;



let item=current[row.dataset.i];



document.getElementById("d-name").textContent=item.name;


document.getElementById("d-cat").textContent=item.category;


document.getElementById("d-tel").textContent=item.phone;


document.getElementById("d-call").href=

"tel:"+item.phone;



document.getElementById("d-type").textContent=item.type;


document.getElementById("d-assist").textContent=item.assistant;


document.getElementById("d-address").textContent=item.adresse;


document.getElementById("d-email").textContent=item.email;


document.getElementById("d-services").textContent=item.services;





drawer.classList.add("show");


});





document.getElementById("closeDrawer")

.onclick=()=>{

drawer.classList.remove("show");

};



</script>


</div>

</body>

</html>
