<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADRAH">
<link rel="apple-touch-icon" href="icon.PNG">
<title>ADRAH</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{--blue:#005BFF;--cyan:#00a2ff;--cat-color:#00a2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,sans-serif;color:#fff;background:#05070b;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,10,30,.55)),url("fond-adrah.PNG") center/cover no-repeat;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:560px;margin:auto;padding:20px}
.search input{width:100%;height:62px;border-radius:22px;border:2px solid var(--blue);background:rgba(0,0,0,.6);color:#fff;font-size:18px;font-weight:900;text-align:center;outline:none;box-shadow:0 0 10px var(--blue),0 0 35px rgba(0,91,255,.6)}
.search input::placeholder{color:#9ed2ff}
h2{font-size:15px;color:#00a2ff;text-shadow:0 0 10px #005BFF}
#count{color:#fff;text-shadow:0 0 5px #fff,0 0 12px rgba(255,255,255,.75),0 0 20px rgba(255,255,255,.35)}
.grid{display:grid;gap:16px;transition:.35s ease;opacity:1;transform:translateX(0)}
.grid.hide{opacity:0;transform:translateX(-60px);pointer-events:none}
#results{margin-top:25px;transition:.35s ease;opacity:0;transform:translateX(60px)}
#results.show{opacity:1;transform:translateX(0)}

.card{position:relative;display:flex;align-items:center;gap:20px;padding:22px;min-height:120px;border-radius:30px;background:linear-gradient(135deg,color-mix(in srgb,var(--cat-color),transparent 80%),rgba(0,0,0,.68));border:1px solid var(--cat-color);box-shadow:0 0 15px var(--cat-color),0 0 40px color-mix(in srgb,var(--cat-color),transparent 60%),inset 0 0 30px rgba(255,255,255,.04),inset 0 0 25px color-mix(in srgb,var(--cat-color),transparent 75%);overflow:hidden;isolation:isolate}
.card:hover{transform:translateY(-2px)}
.card:after{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:4;opacity:0;background:var(--cat-color);mix-blend-mode:screen}
.card.lightning-hit:after{animation:cardShock .22s ease-out}
@keyframes cardShock{0%{opacity:0}20%{opacity:.34}45%{opacity:.08}65%{opacity:.22}100%{opacity:0}}

.lightning-layer{position:absolute;inset:0;overflow:hidden;border-radius:30px;pointer-events:none;z-index:2;isolation:isolate}
.dynamic-lightning{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:0;mix-blend-mode:screen;transform:translateZ(0);will-change:opacity}
.lightning-flash{animation:lightningFlash var(--flash-time) linear forwards}
@keyframes lightningFlash{
0%{opacity:0}
5%{opacity:.98}
10%{opacity:.22}
15%{opacity:1}
22%{opacity:.08}
29%{opacity:.95}
39%{opacity:.18}
49%{opacity:.78}
62%{opacity:.12}
76%{opacity:.38}
100%{opacity:0}
}
.bolt-halo{fill:none;stroke:var(--cat-color);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;opacity:.16;filter:blur(10px)}
.bolt-glow{fill:none;stroke:var(--cat-color);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.58;filter:blur(3px)}
.bolt-glow2{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.8;filter:blur(1.5px)}
.bolt-core{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--cat-color)) drop-shadow(0 0 20px var(--cat-color))}
.bolt-branch{fill:none;stroke:#fff;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;opacity:.92;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px var(--cat-color))}
.impact{fill:#fff;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px var(--cat-color))}
.impact-ring{fill:none;stroke:var(--cat-color);stroke-width:3;opacity:.8;filter:blur(2px)}
.impact-group{transform-origin:center;animation:impactPulse .42s ease-out forwards}
@keyframes impactPulse{0%{opacity:0;transform:scale(.35)}18%{opacity:1;transform:scale(1.1)}55%{opacity:.7;transform:scale(1.35)}100%{opacity:0;transform:scale(1.8)}}

.card>i{position:relative;z-index:10;font-size:45px;color:#fff;text-shadow:0 0 5px #fff,0 0 15px var(--cat-color),0 0 35px var(--cat-color)}
.card h3{position:relative;z-index:10;margin:0;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 5px #fff,0 0 15px var(--cat-color),0 0 35px var(--cat-color);word-break:break-word}
.card span{position:relative;z-index:10;color:var(--cat-color);text-shadow:0 0 10px var(--cat-color)}

.row{position:relative;display:flex;align-items:center;gap:18px;padding:16px 18px;min-height:95px;margin-bottom:15px;border-radius:25px;background:linear-gradient(135deg,color-mix(in srgb,var(--cat-color),transparent 92%),rgba(0,0,0,.55));border:1px solid var(--cat-color);box-shadow:0 0 20px color-mix(in srgb,var(--cat-color),transparent 50%);transition:.25s}
.row:hover{transform:translateY(-1px)}
.row>div:first-child{flex:1;min-width:0}
.title{display:flex;align-items:flex-end;min-height:26px;font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 5px #fff,0 0 12px rgba(255,255,255,.75),0 0 20px rgba(255,255,255,.35)}
.sub{display:flex;align-items:flex-start;min-height:22px;margin-top:2px;color:color-mix(in srgb,var(--cat-color),white 30%);font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-shadow:0 0 8px color-mix(in srgb,var(--cat-color),transparent 40%)}
.tip-slot{display:flex;align-items:center;height:22px;margin-top:4px}
.tip-label{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,213,74,.12);border:1px solid rgba(255,213,74,.45);color:#FFD54A;font-size:12px;font-weight:700;box-shadow:0 0 10px rgba(255,213,74,.15)}
.tip-label i{font-size:14px}
.call{width:52px;height:52px;min-width:52px;min-height:52px;flex:0 0 52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cat-color);color:#fff;font-size:26px;text-decoration:none;box-shadow:0 0 25px var(--cat-color)}

#d-call{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;margin:20px 0;border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--cat-color),white 15%),var(--cat-color));color:#fff;font-size:17px;font-weight:900;text-decoration:none;box-shadow:0 6px 20px color-mix(in srgb,var(--cat-color),transparent 55%),0 0 30px color-mix(in srgb,var(--cat-color),transparent 45%);transition:.25s}
#d-call:hover{transform:translateY(-2px)}
#d-call i{font-size:22px}
.drawer{--cat-color:#00a2ff;position:fixed;top:0;right:0;height:100%;width:min(420px,95vw);background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-left:2px solid var(--cat-color);transform:translateX(100%);transition:.3s;z-index:999;padding:25px;overflow:auto;box-shadow:0 0 25px color-mix(in srgb,var(--cat-color),transparent 55%)}
.drawer.show{transform:translateX(0)}
.close{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:color-mix(in srgb,var(--cat-color),transparent 92%);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 0 15px color-mix(in srgb,var(--cat-color),transparent 75%)}
#d-name{font-size:36px;font-weight:900;margin:10px 0 0;line-height:1.15;text-align:center;color:#fff;text-shadow:0 0 5px #fff,0 0 15px rgba(255,255,255,.75),0 0 30px rgba(255,255,255,.35)}
#d-cat{margin:8px 0 20px;font-size:17px;font-weight:800;text-align:center;color:var(--cat-color);text-shadow:0 0 10px var(--cat-color)}
.drawer .info-value{color:var(--cat-color);text-shadow:0 0 12px var(--cat-color)}
.info{margin-top:30px}.info-box{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08)}.info-box:last-child{border-bottom:none}.info-title{color:#9db8d7;letter-spacing:1px;text-transform:uppercase;font-size:15px;font-weight:700;margin-bottom:8px}.info-value{font-size:22px;font-weight:900}.info-value a{color:var(--cat-color)!important;text-decoration:none!important}.back-btn{width:100%;height:58px;border:none;border-radius:20px;background:color-mix(in srgb,var(--cat-color),transparent 75%);border:2px solid var(--cat-color);color:#fff;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 0 15px color-mix(in srgb,var(--cat-color),transparent 40%)}
#d-services{white-space:pre-wrap;line-height:1.45;font-size:20px}
#d-email{overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
#d-address{-webkit-user-select:none;user-select:none}
@media(max-width:480px){.app{padding:15px}.card{min-height:112px;padding:20px}.card h3{font-size:27px}.card>i{font-size:40px}}
</style>
</head>

<body>
<div class="app">
<div class="search"><input id="q" placeholder="rechercher" autocomplete="off"></div>
<h2 id="secretTrigger">CATÉGORIES</h2>
<div class="grid" id="cats"></div>

<section id="results" style="display:none">
<div id="backBox" style="display:none;margin:20px 0"><button id="backBtn" class="back-btn"><i class="ph ph-arrow-left"></i>Retour aux catégories</button></div>
<h2 id="count"></h2><div id="list"></div>
</section>

<aside id="drawer" class="drawer">
<button class="close" id="closeDrawer"><i class="ph ph-arrow-left"></i></button>
<h1 id="d-name"></h1><h3 id="d-cat"></h3>
<a id="d-call"><span id="d-tel"></span></a>
<div class="info">
<div id="typeBox" class="info-box"><div class="info-title">Type</div><div id="d-type" class="info-value"></div></div>
<div id="assistBox" class="info-box"><div class="info-title">Assisteur</div><div id="d-assist" class="info-value"></div></div>
<div id="countryBox" class="info-box"><div class="info-title">Pays</div><div id="d-country" class="info-value"></div></div>
<div id="availableBox" class="info-box"><div class="info-title">Disponibilité</div><div class="info-value">24h/24 • 7j/7</div></div>
<div id="addressBox" class="info-box"><div class="info-title">Adresse</div><div class="info-value"><a id="d-address" target="_blank"></a></div></div>
<div id="emailBox" class="info-box"><div class="info-title">Email</div><div class="info-value" id="d-email"></div></div>
<div id="servicesBox" class="info-box"><div class="info-title">Services</div><div class="info-value" id="d-services"></div></div>
</div>
</aside>
</div>

<script>
const CATEGORY_COLORS={VL:"#2E7DFF",PL:"#2E7DFF",MOTO:"#2E7DFF",LOCATION:"#2E7DFF",ASSURANCE:"#2E7DFF",GARAGE:"#2E7DFF",POLICE:"#00B7FF",GENDARMERIE:"#2E7DFF",POMPIERS:"#ff1e1e",SAMU:"#00bfa5",AUTOROUTE:"#ffcc00",ADRAH:"#00a2ff"};
const CATEGORIES=[
{key:"VL",label:"VL",sub:"Véhicule léger",icon:"ph-car"},
{key:"PL",label:"PL",sub:"Poids lourd",icon:"ph-truck"},
{key:"MOTO",label:"MOTO",sub:"Deux roues",icon:"ph-motorcycle"},
{key:"LOCATION",label:"LOCATION",sub:"Location",icon:"ph-key"},
{key:"ASSURANCE",label:"ASSURANCE",sub:"Assurance",icon:"ph-shield"},
{key:"GARAGE",label:"GARAGE",sub:"Partenaires",icon:"ph-wrench"}];
const SECRET_CATEGORIES=[
{key:"POLICE",label:"POLICE",sub:"Police Nationale",icon:"ph-shield"},
{key:"GENDARMERIE",label:"GENDARMERIE",sub:"Brigades",icon:"ph-shield-star"},
{key:"POMPIERS",label:"POMPIERS",sub:"SDIS",icon:"ph-fire-truck"},
{key:"SAMU",label:"SAMU",sub:"Urgences",icon:"ph-ambulance"},
{key:"AUTOROUTE",label:"AUTOROUTE",sub:"DIR / PC",icon:"ph-road-horizon"},
{key:"ADRAH",label:"ADRAH",sub:"Numéros utiles",icon:"ph-phone-call"}];

const getCategoryColor=c=>CATEGORY_COLORS[String(c||"").toUpperCase().trim()]||"#00a2ff";
const cats=document.getElementById("cats");
let DATA=[],current=[],secretMode=false;

function boltPath(w,h){
    const padX=Math.max(12,w*.025),padY=Math.max(10,h*.08);
    let x=padX+Math.random()*(w-padX*2), y=padY+Math.random()*(h-padY*2);
    const side=Math.floor(Math.random()*4);
    if(side===0)x=w*.15+Math.random()*w*.7,y=padY;
    if(side===1)x=w-padX,y=h*.15+Math.random()*h*.7;
    if(side===2)x=w*.15+Math.random()*w*.7,y=h-padY;
    if(side===3)x=padX,y=h*.15+Math.random()*h*.7;
    const tx=w*.48+(Math.random()-.5)*w*.16,ty=h*.50+(Math.random()-.5)*h*.20;
    const pts=[[x,y]];
    const n=7+Math.floor(Math.random()*5);
    for(let i=1;i<=n;i++){
        const p=i/n,chaos=(1-p)*30+6;
        pts.push([
            Math.max(7,Math.min(w-7,x+(tx-x)*p+(Math.random()-.5)*chaos)),
            Math.max(7,Math.min(h-7,y+(ty-y)*p+(Math.random()-.5)*chaos))
        ]);
    }
    let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++)d+=` L ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
    return {d,pts};
}
function branches(pts,w,h){
    let out="";
    for(let i=1;i<pts.length-1;i++){
        const count=Math.random()<.8?1:2;
        for(let b=0;b<count;b++){
            if(Math.random()>.62)continue;
            const [x,y]=pts[i],len=18+Math.random()*38,ang=Math.random()*Math.PI*2;
            const x2=Math.max(7,Math.min(w-7,x+Math.cos(ang)*len));
            const y2=Math.max(7,Math.min(h-7,y+Math.sin(ang)*len));
            const len2=8+Math.random()*20,a2=ang+(Math.random()-.5)*1.1;
            const x3=Math.max(7,Math.min(w-7,x2+Math.cos(a2)*len2));
            const y3=Math.max(7,Math.min(h-7,y2+Math.sin(a2)*len2));
            out+=`<path class="bolt-branch" d="M ${x.toFixed(1)} ${y.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)} L ${x3.toFixed(1)} ${y3.toFixed(1)}"/>`;
        }
    }
    return out;
}
function createLightning(card){
    const layer=card.querySelector(".lightning-layer"); if(!layer)return;
    const r=card.getBoundingClientRect(),w=Math.max(220,r.width),h=Math.max(100,r.height);
    const bolt=boltPath(w,h);
    const ns="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(ns,"svg");
    svg.classList.add("dynamic-lightning","lightning-flash");
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
    svg.setAttribute("preserveAspectRatio","none");
    const duration=520+Math.random()*260;
    svg.style.setProperty("--flash-time",duration+"ms");

    const make=(tag,cls,d)=>{
        const e=document.createElementNS(ns,tag);e.setAttribute("class",cls);if(d)e.setAttribute("d",d);return e;
    };
    svg.appendChild(make("path","bolt-halo",bolt.d));
    svg.appendChild(make("path","bolt-glow",bolt.d));
    svg.appendChild(make("path","bolt-glow2",bolt.d));

    const g=document.createElementNS(ns,"g");g.innerHTML=branches(bolt.pts,w,h);svg.appendChild(g);
    svg.appendChild(make("path","bolt-core",bolt.d));

    const end=bolt.pts[bolt.pts.length-1],ig=document.createElementNS(ns,"g");
    ig.setAttribute("class","impact-group");
    const ring=make("circle","impact-ring");ring.setAttribute("cx",end[0]);ring.setAttribute("cy",end[1]);ring.setAttribute("r",13);ig.appendChild(ring);
    const dot=make("circle","impact");dot.setAttribute("cx",end[0]);dot.setAttribute("cy",end[1]);dot.setAttribute("r",3.5);ig.appendChild(dot);
    svg.appendChild(ig);layer.appendChild(svg);

    card.classList.remove("lightning-hit");void card.offsetWidth;card.classList.add("lightning-hit");
    setTimeout(()=>{if(svg.parentNode)svg.remove();card.classList.remove("lightning-hit")},duration+80);

    if(Math.random()<.28){
        setTimeout(()=>{if(document.body.contains(card))createLightning(card)},180+Math.random()*180);
    }
}
function startLightning(card){
    if(card.dataset.lightningStarted==="1")return;
    card.dataset.lightningStarted="1";
    const next=()=>{
        if(!document.body.contains(card)){card.dataset.lightningStarted="0";return}
        const delay=850+Math.random()*1500;
        setTimeout(()=>{if(document.body.contains(card)){createLightning(card);next()}},delay);
    };
    setTimeout(next,300+Math.random()*900);
}
function renderCategories(data){
    cats.innerHTML=data.map(c=>`<div class="card" data-cat="${c.key}" style="--cat-color:${getCategoryColor(c.key)}"><div class="lightning-layer"></div><i class="ph ${c.icon}"></i><div><h3>${c.label}</h3><span>${c.sub}</span></div></div>`).join("");
    cats.querySelectorAll(".card").forEach(startLightning);
}
renderCategories(CATEGORIES);

let secretClicks=0;
document.getElementById("secretTrigger").onclick=()=>{
    secretClicks++;setTimeout(()=>secretClicks=0,800);
    if(secretClicks>=2){secretClicks=0;secretMode=!secretMode;cats.classList.add("hide");setTimeout(()=>{renderCategories(secretMode?SECRET_CATEGORIES:CATEGORIES);cats.classList.remove("hide")},300)}
};

const fichiers=["data.json","data2.json","data3.json","garage.json","adrah.json","police.json","gendarmerie.json","autoroute.json","pompiers.json","samu.json"];
Promise.all(fichiers.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f+" introuvable");return r.text()}).then(t=>t.trim()?JSON.parse(t):[])))
.then(files=>{
    DATA=files.flat().map(x=>({
        name:String(x.nom||x.name||"").trim(),
        phone:String(x.telephone||x.phone||x.tel||x.numero||""),
        category:String(x.categorie||x.category||x.service||"").toUpperCase().trim(),
        pays:String(x.pays||"").toUpperCase().trim(),
        type:String(x.type||"").trim(),
        assistant:String(x.assisteur||x.assistant||"").trim(),
        email:x.email||"",services:x.services||"",adresse:x.adresse||"",pourboire:x.pourboire===true
    })).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
}).catch(err=>{document.body.insertAdjacentHTML("beforeend",`<div style="position:fixed;bottom:10px;left:10px;right:10px;background:red;color:white;padding:20px;border-radius:15px;z-index:99999">❌ ERREUR : ${err.message}</div>`)})

const q=document.getElementById("q"),results=document.getElementById("results"),list=document.getElementById("list"),count=document.getElementById("count"),backBox=document.getElementById("backBox"),backBtn=document.getElementById("backBtn");
const normalize=t=>String(t??"").toLocaleLowerCase("fr-FR").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[-_]/g," ").replace(/\s+/g," ").trim();

function render(rows,category=""){
    current=rows;const color=getCategoryColor(category);results.style.setProperty("--cat-color",color);backBtn.style.setProperty("--cat-color",color);
    results.style.display="block";results.classList.add("show");backBox.style.display="block";count.textContent=rows.length+" résultat(s)";
    if(!rows.length){list.innerHTML=`<div class="row" style="--cat-color:${color}"><div><div class="title">Aucun résultat</div><div class="sub">Cette catégorie est vide.</div></div></div>`;return}
    list.innerHTML=rows.map((r,i)=>`<div class="row" data-i="${i}" style="--cat-color:${getCategoryColor(category||r.category)}"><div><div class="title">${r.name}</div><div class="sub">${r.category}${r.category!=="GARAGE"?" · "+r.assistant:""}</div><div class="tip-slot">${r.category==="GARAGE"&&r.pourboire?`<div class="tip-label"><i class="ph ph-coins"></i>Pourboire</div>`:""}</div></div><a class="call" href="tel:${r.phone}"><i class="ph ph-phone"></i></a></div>`).join("");
    setTimeout(()=>results.scrollIntoView({behavior:"smooth",block:"start"}),100);
}
function search(text){
    const n=normalize(text);if(!n){results.classList.remove("show");setTimeout(()=>results.style.display="none",300);backBox.style.display="none";return}
    const words=n.split(" ").filter(Boolean);
    const rows=DATA.map(item=>{
        const fields=[item.name,item.phone,item.category,item.type,item.assistant,item.services,item.pays].map(normalize),searchable=fields.join(" "),compact=searchable.replace(/\s/g,"");
        if(!words.every(w=>searchable.includes(w)||compact.includes(w.replace(/\s/g,""))))return null;
        let score=0;words.forEach(w=>{if(fields[0]===w)score+=100;else if(fields[0].startsWith(w))score+=70;else if(fields[0].includes(w))score+=50;if(fields[2]===w)score+=40;else if(fields[2].includes(w))score+=25;if(fields[3].includes(w))score+=20;if(fields[4].includes(w))score+=15;if(fields[5].includes(w))score+=10;if(fields[1].includes(w))score+=10});return{item,score}
    }).filter(Boolean).sort((a,b)=>b.score-a.score||a.item.name.localeCompare(b.item.name,"fr")).map(x=>x.item);
    render(rows);
}
q.addEventListener("input",e=>search(e.target.value));

cats.addEventListener("click",e=>{
    const card=e.target.closest(".card");if(!card)return;const key=card.dataset.cat;
    let rows=key==="ASSURANCE"?DATA.filter(x=>x.category.includes("ASSUR")||x.category.includes("COURT")||x.type.toUpperCase().includes("ASSUR")||x.assistant.toUpperCase().includes("ASSUR")):DATA.filter(x=>x.category===key);
    rows.sort((a,b)=>(a.pays==="FR"&&b.pays!=="FR"?-1:a.pays!=="FR"&&b.pays==="FR"?1:a.name.localeCompare(b.name,"fr")));
    cats.classList.add("hide");setTimeout(()=>{cats.style.display="none";render(rows,key)},300);
});

const drawer=document.getElementById("drawer");
list.addEventListener("click",e=>{
    if(e.target.closest(".call"))return;const row=e.target.closest(".row");if(!row)return;const item=current[row.dataset.i];
    drawer.style.setProperty("--cat-color",getCategoryColor(item.category));
    document.getElementById("d-name").textContent=item.name;document.getElementById("d-cat").textContent=item.category;document.getElementById("d-tel").textContent=item.phone;document.getElementById("d-call").href="tel:"+item.phone;
    document.getElementById("d-type").textContent=item.type;document.getElementById("d-assist").textContent=item.assistant;document.getElementById("d-country").textContent=item.pays;
    const ids=["typeBox","assistBox","countryBox","availableBox","addressBox","emailBox","servicesBox"];ids.forEach(id=>document.getElementById(id).style.display="none");
    if(item.category==="GARAGE"){["addressBox","emailBox","servicesBox"].forEach(id=>document.getElementById(id).style.display="block")}
    else{["typeBox","assistBox","countryBox","availableBox"].forEach(id=>document.getElementById(id).style.display="block")}
    const address=document.getElementById("d-address");address.textContent=item.adresse||"—";if(item.adresse){address.href="https://maps.apple.com/?q="+encodeURIComponent(item.adresse)}else address.removeAttribute("href");
    const email=document.getElementById("d-email");email.textContent=item.email||"—";email.onclick=async()=>{if(!item.email)return;try{await navigator.clipboard.writeText(item.email);const old=email.textContent;email.textContent="✓ Copié";setTimeout(()=>email.textContent=old,1200)}catch{}};
    document.getElementById("d-services").textContent=item.services;drawer.classList.add("show");
});
document.getElementById("closeDrawer").onclick=()=>drawer.classList.remove("show");
backBtn.onclick=()=>{
    q.value="";results.classList.remove("show");setTimeout(()=>results.style.display="none",300);backBox.style.display="none";list.innerHTML="";cats.style.display="grid";renderCategories(secretMode?SECRET_CATEGORIES:CATEGORIES);setTimeout(()=>cats.classList.remove("hide"),20);window.scrollTo({top:0,behavior:"smooth"});
};
</script>
</body>
</html>
