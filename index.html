<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADRAH">

<link rel="apple-touch-icon" href="icon.PNG">

<title>ADRAH</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   VARIABLES
   ========================================================= */

:root{
    --blue:#005BFF;
    --cyan:#00a2ff;
    --glass:rgba(0,0,0,.55);
    --cat-color:#00a2ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Inter,sans-serif;

    color:white;

    background:#05070b;

    overflow-x:hidden;
}

body::before{
    content:"";

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,10,30,.55)
        ),
        url("fond-adrah.PNG");

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    z-index:0;

    pointer-events:none;
}

.app{
    position:relative;

    z-index:1;

    max-width:560px;

    margin:auto;

    padding:20px;
}


/* =========================================================
   RECHERCHE
   ========================================================= */

.search input{
    width:100%;
    height:62px;

    border-radius:22px;

    border:2px solid var(--blue);

    background:rgba(0,0,0,.6);

    color:white;

    font-size:18px;

    font-weight:900;

    text-align:center;

    outline:none;

    box-shadow:
        0 0 10px var(--blue),
        0 0 35px rgba(0,91,255,.6);

    transition:.25s;
}

.search input:focus{
    box-shadow:
        0 0 12px var(--blue),
        0 0 45px rgba(0,91,255,.8);
}

.search input::placeholder{
    color:#9ed2ff;
}


/* =========================================================
   TITRES
   ========================================================= */

h2{
    font-size:15px;

    color:#00a2ff;

    text-shadow:
        0 0 10px #005BFF;
}

#count{
    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}


/* =========================================================
   GRILLE
   ========================================================= */

.grid{
    display:grid;

    gap:16px;

    transition:.35s ease;

    opacity:1;

    transform:translateX(0);
}

.grid.hide{
    opacity:0;

    transform:translateX(-60px);

    pointer-events:none;
}


/* =========================================================
   RÉSULTATS
   ========================================================= */

#results{
    margin-top:25px;

    transition:.35s ease;

    opacity:0;

    transform:translateX(60px);
}

#results.show{
    opacity:1;

    transform:translateX(0);
}


/* =========================================================
   CARTES
   ========================================================= */

.card{

    position:relative;

    display:flex;

    align-items:center;

    gap:20px;

    padding:22px;

    min-height:120px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 80%
            ),
            rgba(0,0,0,.68)
        );

    border:1px solid var(--cat-color);

    box-shadow:

        0 0 15px var(--cat-color),

        0 0 40px color-mix(
            in srgb,
            var(--cat-color),
            transparent 60%
        ),

        inset 0 0 30px rgba(255,255,255,.04),

        inset 0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );

    transition:
        transform .25s,
        box-shadow .2s;

    overflow:hidden;

    isolation:isolate;
}

.card:hover{
    transform:translateY(-2px);
}


/* =========================================================
   ⚡ COUCHE FOUDRE
   ========================================================= */

.lightning-layer{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:30px;

    pointer-events:none;

    z-index:2;

    isolation:isolate;

    /*
       Très léger éclairage général.
       Il est animé par JS.
    */

    transition:
        background .08s ease;
}


/* =========================================================
   ⚡ FLASH GLOBAL
   ========================================================= */

.lightning-flash-bg{

    position:absolute;

    inset:0;

    border-radius:30px;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            ellipse at var(--flash-x) var(--flash-y),
            color-mix(
                in srgb,
                white,
                var(--cat-color) 35%
            ),
            transparent 62%
        );

    mix-blend-mode:screen;

    z-index:0;

    filter:blur(8px);
}


/* =========================================================
   ⚡ SVG
   ========================================================= */

.dynamic-lightning{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    pointer-events:none;

    opacity:0;

    border-radius:30px;

    clip-path:
        inset(
            1px
            1px
            1px
            1px
            round 29px
        );

    mix-blend-mode:screen;

    transform:translateZ(0);

    will-change:opacity;

    z-index:3;
}


/* =========================================================
   ⚡ HALO
   ========================================================= */

.bolt-halo{

    fill:none;

    stroke:var(--cat-color);

    stroke-width:13;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.18;

    vector-effect:non-scaling-stroke;

    filter:
        blur(8px);
}


/* =========================================================
   ⚡ GLOW
   ========================================================= */

.bolt-glow{

    fill:none;

    stroke:var(--cat-color);

    stroke-width:5;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.55;

    vector-effect:non-scaling-stroke;

    filter:
        blur(2.8px)
        drop-shadow(
            0 0 8px var(--cat-color)
        );
}


/* =========================================================
   ⚡ CŒUR BLANC
   ========================================================= */

.bolt-core{

    fill:none;

    stroke:#ffffff;

    stroke-width:1.15;

    stroke-linecap:round;

    stroke-linejoin:round;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(0 0 1px #ffffff)
        drop-shadow(0 0 3px #ffffff)
        drop-shadow(0 0 7px #ffffff)
        drop-shadow(0 0 13px var(--cat-color));
}


/* =========================================================
   ⚡ PETITES BRANCHES
   ========================================================= */

.bolt-branch{

    fill:none;

    stroke:#ffffff;

    stroke-width:.65;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.85;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(0 0 2px white)
        drop-shadow(0 0 5px var(--cat-color));
}


/* =========================================================
   ⚡ MICRO-BRANCHES
   ========================================================= */

.bolt-mini{

    fill:none;

    stroke:#ffffff;

    stroke-width:.45;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.55;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(0 0 2px white)
        drop-shadow(0 0 4px var(--cat-color));
}


/* =========================================================
   ⚡ ANIMATION
   ========================================================= */

.lightning-strike{

    animation:
        realisticLightning
        var(--strike-duration)
        linear
        forwards;
}


@keyframes realisticLightning{

    0%{
        opacity:0;
    }

    5%{
        opacity:1;
    }

    9%{
        opacity:.08;
    }

    14%{
        opacity:.95;
    }

    20%{
        opacity:.12;
    }

    26%{
        opacity:.82;
    }

    34%{
        opacity:.04;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   ICÔNES CARTES
   ========================================================= */

.card > i{

    position:relative;

    z-index:10;

    font-size:45px;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);
}

.card h3{

    position:relative;

    z-index:10;

    margin:0;

    font-size:30px;

    font-weight:900;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);

    word-break:break-word;
}

.card span{

    position:relative;

    z-index:10;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}


/* =========================================================
   RÉSULTATS
   ========================================================= */

.row{

    position:relative;

    display:flex;

    align-items:center;

    gap:18px;

    padding:16px 18px;

    min-height:95px;

    margin-bottom:15px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 92%
            ),
            rgba(0,0,0,.55)
        );

    border:1px solid var(--cat-color);

    box-shadow:
        0 0 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 50%
        );

    transition:.25s;
}

.row:hover{
    transform:translateY(-1px);
}

.row > div:first-child{
    flex:1;

    min-width:0;
}


/* =========================================================
   POURBOIRE
   ========================================================= */

.tip-slot{

    display:flex;

    align-items:center;

    height:22px;

    margin-top:4px;
}

.tip-label{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:4px 10px;

    border-radius:999px;

    background:rgba(255,213,74,.12);

    border:1px solid rgba(255,213,74,.45);

    color:#FFD54A;

    font-size:12px;

    font-weight:700;

    box-shadow:
        0 0 10px rgba(255,213,74,.15);
}

.tip-label i{
    font-size:14px;
}


/* =========================================================
   TEXTE
   ========================================================= */

.title{

    display:flex;

    align-items:flex-end;

    min-height:26px;

    font-size:18px;

    font-weight:900;

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}

.sub{

    display:flex;

    align-items:flex-start;

    min-height:22px;

    margin-top:2px;

    color:
        color-mix(
            in srgb,
            var(--cat-color),
            white 30%
        );

    font-weight:700;

    line-height:1.2;

    overflow-wrap:anywhere;

    text-shadow:
        0 0 8px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}


/* =========================================================
   BOUTON APPEL
   ========================================================= */

.call{

    width:52px;

    height:52px;

    min-width:52px;

    min-height:52px;

    flex:0 0 52px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--cat-color);

    color:white;

    font-size:26px;

    text-decoration:none;

    box-shadow:
        0 0 25px var(--cat-color);
}


/* =========================================================
   BOUTON DRAWER
   ========================================================= */

#d-call{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    width:100%;

    height:58px;

    margin:20px 0;

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            color-mix(
                in srgb,
                var(--cat-color),
                white 15%
            ),
            var(--cat-color)
        );

    color:white;

    font-size:17px;

    font-weight:900;

    text-decoration:none;

    box-shadow:

        0 6px 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        ),

        0 0 30px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );

    transition:.25s;
}

#d-call:hover{

    transform:translateY(-2px);

    box-shadow:

        0 12px 35px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}

#d-call i{
    font-size:22px;
}


/* =========================================================
   DRAWER
   ========================================================= */

.drawer{

    --cat-color:#00a2ff;

    position:fixed;

    top:0;

    right:0;

    height:100%;

    width:min(420px,95vw);

    background:rgba(0,0,0,.9);

    backdrop-filter:blur(20px);

    border-left:2px solid var(--cat-color);

    transform:translateX(100%);

    transition:.3s;

    z-index:999;

    padding:25px;

    overflow:auto;

    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        );
}

.drawer.show{
    transform:translateX(0);
}


/* =========================================================
   DRAWER TEXTES
   ========================================================= */

.drawer #d-name{

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 15px rgba(255,255,255,.75),
        0 0 30px rgba(255,255,255,.35);
}

.drawer #d-cat{

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}

.drawer .info-value{

    color:var(--cat-color);

    text-shadow:
        0 0 12px var(--cat-color);
}


/* =========================================================
   FERMETURE
   ========================================================= */

.close{

    width:52px;

    height:52px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:none;

    border-radius:50%;

    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 92%
        );

    color:white;

    font-size:24px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );
}

.close:hover{

    transform:scale(1.08);

    background:var(--cat-color);
}


/* =========================================================
   INFOS
   ========================================================= */

.info{
    margin-top:30px;
}

.info-box{

    padding:18px 0;

    border:none;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    background:none;

    box-shadow:none;

    border-radius:0;
}

.info-box:last-child{
    border-bottom:none;
}

.info-title{

    color:#9db8d7;

    letter-spacing:1px;

    text-transform:uppercase;

    font-size:15px;

    font-weight:700;

    margin-bottom:8px;
}

.info-value{

    color:var(--cat-color);

    font-size:22px;

    font-weight:900;

    text-shadow:
        0 0 12px var(--cat-color);
}


/* =========================================================
   NOM DRAWER
   ========================================================= */

#d-name{

    font-size:36px;

    font-weight:900;

    margin:10px 0 0;

    line-height:1.15;

    text-align:center;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}

#d-cat{

    margin:8px 0 20px;

    font-size:17px;

    font-weight:800;

    text-align:center;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}


/* =========================================================
   LIENS / SERVICES
   ========================================================= */

.info-value a{

    color:var(--cat-color) !important;

    text-decoration:none !important;

    text-shadow:
        0 0 10px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );
}

#d-services{

    white-space:pre-wrap;

    line-height:1.45;

    font-size:20px;
}

#d-email{

    overflow-wrap:anywhere;

    text-decoration:none !important;

    color:var(--cat-color) !important;

    -webkit-text-decoration:none !important;

    text-decoration-line:none !important;

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;

    user-select:none;
}

#d-address{

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;

    user-select:none;
}


/* =========================================================
   RETOUR
   ========================================================= */

.back-btn{

    width:100%;

    height:58px;

    border:none;

    border-radius:20px;

    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );

    border:2px solid var(--cat-color);

    color:white;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );

    transition:.2s;
}

.back-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 20%
        );
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:480px){

    .app{
        padding:15px;
    }

    .card{
        min-height:112px;

        padding:20px;
    }

    .card h3{
        font-size:27px;
    }

    .card > i{
        font-size:40px;
    }

    .lightning-layer{
        border-radius:30px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     RECHERCHE
     ======================================================= -->

<div class="search">

<input
    id="q"
    placeholder="rechercher"
    autocomplete="off"
>

</div>


<h2 id="secretTrigger">
CATÉGORIES
</h2>


<div
    class="grid"
    id="cats"
></div>


<!-- =======================================================
     RÉSULTATS
     ======================================================= -->

<section
    id="results"
    style="display:none"
>

<div
    id="backBox"
    style="display:none;margin:20px 0;"
>

<button
    id="backBtn"
    class="back-btn"
>

<i class="ph ph-arrow-left"></i>

Retour aux catégories

</button>

</div>


<h2 id="count"></h2>


<div id="list"></div>

</section>


<!-- =======================================================
     DRAWER
     ======================================================= -->

<aside
    id="drawer"
    class="drawer"
>


<button
    class="close"
    id="closeDrawer"
>

<i class="ph ph-arrow-left"></i>

</button>


<h1 id="d-name"></h1>

<h3 id="d-cat"></h3>


<a
    id="d-call"
    class="call"
>

<span id="d-tel"></span>

</a>


<div class="info">


<div
    id="typeBox"
    class="info-box"
>

<div class="info-title">
Type
</div>

<div
    id="d-type"
    class="info-value"
></div>

</div>


<div
    id="assistBox"
    class="info-box"
>

<div class="info-title">
Assisteur
</div>

<div
    id="d-assist"
    class="info-value"
></div>

</div>


<div
    id="countryBox"
    class="info-box"
>

<div class="info-title">
Pays
</div>

<div
    id="d-country"
    class="info-value"
></div>

</div>


<div
    id="availableBox"
    class="info-box"
>

<div class="info-title">
Disponibilité
</div>

<div class="info-value">
24h/24 • 7j/7
</div>

</div>


<div
    id="addressBox"
    class="info-box"
>

<div class="info-title">
Adresse
</div>

<div class="info-value">

<a
    id="d-address"
    target="_blank"
></a>

</div>

</div>


<div
    id="emailBox"
    class="info-box"
>

<div class="info-title">
Email
</div>

<div
    class="info-value"
    id="d-email"
></div>

</div>


<div
    id="servicesBox"
    class="info-box"
>

<div class="info-title">
Services
</div>

<div
    class="info-value"
    id="d-services"
></div>

</div>


</div>

</aside>


<script>

/* =========================================================
   COULEURS
   ========================================================= */

const CATEGORY_COLORS = {

    VL:"#2E7DFF",
    PL:"#2E7DFF",
    MOTO:"#2E7DFF",
    LOCATION:"#2E7DFF",
    ASSURANCE:"#2E7DFF",
    GARAGE:"#2E7DFF",

    POLICE:"#00B7FF",
    GENDARMERIE:"#2E7DFF",
    POMPIERS:"#ff1e1e",
    SAMU:"#00bfa5",
    AUTOROUTE:"#ffcc00",
    ADRAH:"#00a2ff"

};


function getCategoryColor(category){

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    return CATEGORY_COLORS[key] || "#00a2ff";
}


function applyCategoryColor(element,category){

    if(!element)
        return;

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    element.style.setProperty(
        "--cat-color",
        getCategoryColor(key)
    );

    element.dataset.cat=key;
}


/* =========================================================
   CATÉGORIES
   ========================================================= */

const CATEGORIES=[

{
    key:"VL",
    label:"VL",
    sub:"Véhicule léger",
    icon:"ph-car"
},

{
    key:"PL",
    label:"PL",
    sub:"Poids lourd",
    icon:"ph-truck"
},

{
    key:"MOTO",
    label:"MOTO",
    sub:"Deux roues",
    icon:"ph-motorcycle"
},

{
    key:"LOCATION",
    label:"LOCATION",
    sub:"Location",
    icon:"ph-key"
},

{
    key:"ASSURANCE",
    label:"ASSURANCE",
    sub:"Assurance",
    icon:"ph-shield"
},

{
    key:"GARAGE",
    label:"GARAGE",
    sub:"Partenaires",
    icon:"ph-wrench"
}

];


const SECRET_CATEGORIES=[

{
    key:"POLICE",
    label:"POLICE",
    sub:"Police Nationale",
    icon:"ph-shield"
},

{
    key:"GENDARMERIE",
    label:"GENDARMERIE",
    sub:"Brigades",
    icon:"ph-shield-star"
},

/* =========================================================
   ⚡ GÉNÉRATEUR DE FOUDRE RÉALISTE
   ========================================================= */

/*
   Cette fonction crée une trajectoire beaucoup
   plus naturelle.

   L'éclair avance de proche en proche,
   avec des changements de direction brusques.

   Il ne cherche PAS le centre de la carte.
*/

function createBoltPath(width,height){

    const marginX=
        Math.max(14,width*.035);

    const marginY=
        Math.max(12,height*.08);


    /*
       Choix aléatoire d'une direction.

       La foudre peut :
       - partir du haut
       - partir du bas
       - partir d'un côté
       - traverser la carte en diagonale
    */

    const side=
        Math.floor(
            Math.random()*4
        );


    let x,y;

    if(side===0){

        x=
            marginX+
            Math.random()*
            (width-marginX*2);

        y=marginY;

    }

    else if(side===1){

        x=
            width-marginX;

        y=
            marginY+
            Math.random()*
            (height-marginY*2);

    }

    else if(side===2){

        x=
            marginX+
            Math.random()*
            (width-marginX*2);

        y=
            height-marginY;

    }

    else{

        x=marginX;

        y=
            marginY+
            Math.random()*
            (height-marginY*2);

    }


    const points=[];

    points.push([x,y]);


    /*
       Direction générale.

       On choisit une cible opposée,
       mais l'éclair ne suivra jamais
       une ligne droite.
    */

    let targetX;
    let targetY;


    if(side===0){

        targetX=
            width*.25+
            Math.random()*width*.5;

        targetY=
            height-marginY;

    }

    else if(side===1){

        targetX=marginX;

        targetY=
            height*.25+
            Math.random()*height*.5;

    }

    else if(side===2){

        targetX=
            width*.25+
            Math.random()*width*.5;

        targetY=marginY;

    }

    else{

        targetX=
            width-marginX;

        targetY=
            height*.25+
            Math.random()*height*.5;

    }


    /*
       Nombre de morceaux.

       Plus il y en a,
       plus l'éclair est nerveux.
    */

    const segments=
        7+
        Math.floor(
            Math.random()*6
        );


    for(
        let i=1;
        i<=segments;
        i++
    ){

        const progress=
            i/segments;


        const idealX=
            x+
            (targetX-x)*progress;

        const idealY=
            y+
            (targetY-y)*progress;


        /*
           Gros déplacement aléatoire.

           C'est CE qui casse l'aspect
           "zigzag artificiel".
        */

        const chaos=
            Math.max(
                8,
                Math.min(
                    width,
                    height
                )*.20
            )
            *
            (1-
                Math.abs(
                    progress-.5
                )*.55
            );


        let px=
            idealX+
            (Math.random()-.5)*
            chaos;

        let py=
            idealY+
            (Math.random()-.5)*
            chaos;


        /*
           On conserve une trajectoire
           relativement cohérente.
        */

        if(
            i>1 &&
            Math.random()<.35
        ){

            const previous=
                points[
                    points.length-1
                ];


            px=
                previous[0]+
                (px-previous[0])*.72;


            py=
                previous[1]+
                (py-previous[1])*.72;

        }


        /*
           Sécurité des bords.
        */

        px=
            Math.max(
                marginX,
                Math.min(
                    width-marginX,
                    px
                )
            );


        py=
            Math.max(
                marginY,
                Math.min(
                    height-marginY,
                    py
                )
            );


        points.push([px,py]);

    }


    /*
       Construction du chemin.
    */

    let d=
        `M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`;


    for(
        let i=1;
        i<points.length;
        i++
    ){

        /*
           Petites cassures supplémentaires.
        */

        d+=
            ` L ${points[i][0].toFixed(1)} ${points[i][1].toFixed(1)}`;

    }


    return {
        d,
        points
    };

}


/* =========================================================
   ⚡ BRANCHES PRINCIPALES
   ========================================================= */

function createBranches(
    points,
    width,
    height
){

    let html="";


    for(
        let i=1;
        i<points.length-1;
        i++
    ){

        /*
           Toutes les branches ne sont pas
           créées à chaque point.

           Cela donne un côté beaucoup plus naturel.
        */

        if(
            Math.random()>.55
        )
            continue;


        const [x,y]=points[i];


        /*
           Direction de la branche.

           Elle part généralement sur le côté
           de la trajectoire.
        */

        const prev=
            points[i-1];

        const next=
            points[i+1];


        const dx=
            next[0]-prev[0];

        const dy=
            next[1]-prev[1];


        const baseAngle=
            Math.atan2(dy,dx);


        const angle=
            baseAngle+
            (
                Math.random()<.5
                ? -1
                : 1
            )
            *
            (
                .7+
                Math.random()*.8
            );


        const length=
            12+
            Math.random()*35;


        const x2=
            x+
            Math.cos(angle)*
            length;


        const y2=
            y+
            Math.sin(angle)*
            length;


        /*
           Deuxième segment.
        */

        const angle2=
            angle+
            (Math.random()-.5)*
            1.1;


        const length2=
            6+
            Math.random()*18;


        const x3=
            x2+
            Math.cos(angle2)*
            length2;


        const y3=
            y2+
            Math.sin(angle2)*
            length2;


        const sx2=
            Math.max(
                6,
                Math.min(
                    width-6,
                    x2
                )
            );


        const sy2=
            Math.max(
                6,
                Math.min(
                    height-6,
                    y2
                )
            );


        const sx3=
            Math.max(
                6,
                Math.min(
                    width-6,
                    x3
                )
            );


        const sy3=
            Math.max(
                6,
                Math.min(
                    height-6,
                    y3
                )
            );


        html+=`

<path
    class="bolt-branch"
    d="
        M ${x.toFixed(1)} ${y.toFixed(1)}
        L ${sx2.toFixed(1)} ${sy2.toFixed(1)}
        L ${sx3.toFixed(1)} ${sy3.toFixed(1)}
    "
></path>
`;

        /*
           Une toute petite ramification
           supplémentaire.
        */

        if(
            Math.random()<.38
        ){

            const miniAngle=
                angle+
                (Math.random()-.5)*
                1.5;


            const miniLength=
                7+
                Math.random()*12;


            const mx=
                sx2+
                Math.cos(miniAngle)*
                miniLength;


            const my=
                sy2+
                Math.sin(miniAngle)*
                miniLength;


            html+=`

<path
    class="bolt-mini"
    d="
        M ${sx2.toFixed(1)} ${sy2.toFixed(1)}
        L ${mx.toFixed(1)} ${my.toFixed(1)}
    "
></path>
`;

        }

    }


    return html;

}


/* =========================================================
   ⚡ CRÉATION D'UNE DÉCHARGE
   ========================================================= */

function createLightning(card){

    const layer=
        card.querySelector(
            ".lightning-layer"
        );


    if(!layer)
        return;


    const rect=
        card.getBoundingClientRect();


    const width=
        Math.max(
            180,
            rect.width
        );


    const height=
        Math.max(
            90,
            rect.height
        );


    /*
       Position du flash général.
    */

    const flashX=
        20+
        Math.random()*60;


    const flashY=
        20+
        Math.random()*60;


    /*
       Génération.
    */

    const bolt=
        createBoltPath(
            width,
            height
        );


    const branches=
        createBranches(
            bolt.points,
            width,
            height
        );


    /*
       FLASH GLOBAL
    */

    const bg=
        document.createElement("div");


    bg.className=
        "lightning-flash-bg";


    bg.style.setProperty(
        "--flash-x",
        `${flashX}%`
    );


    bg.style.setProperty(
        "--flash-y",
        `${flashY}%`
    );


    layer.appendChild(bg);


    /*
       SVG
    */

    const svg=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.setAttribute(
        "class",
        "dynamic-lightning lightning-strike"
    );


    svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
    );


    svg.setAttribute(
        "preserveAspectRatio",
        "none"
    );


    /*
       Durée très courte.

       Une vraie décharge ne reste pas
       allumée tranquillement.
    */

    const duration=
        240+
        Math.random()*260;


    svg.style.setProperty(
        "--strike-duration",
        `${duration}ms`
    );


    /*
       HALO
    */

    const halo=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    halo.setAttribute(
        "class",
        "bolt-halo"
    );


    halo.setAttribute(
        "d",
        bolt.d
    );


    /*
       GLOW
    */

    const glow=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    glow.setAttribute(
        "class",
        "bolt-glow"
    );


    glow.setAttribute(
        "d",
        bolt.d
    );


    /*
       BRANCHES
    */

    const branchGroup=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    branchGroup.innerHTML=
        branches;


    /*
       CŒUR
    */

    const core=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    core.setAttribute(
        "class",
        "bolt-core"
    );


    core.setAttribute(
        "d",
        bolt.d
    );


    svg.appendChild(halo);

    svg.appendChild(glow);

    svg.appendChild(branchGroup);

    svg.appendChild(core);


    layer.appendChild(svg);


    /*
       Animation du flash global.
    */

    bg.animate(
        [
            {
                opacity:0
            },
            {
                opacity:.75,
                offset:.07
            },
            {
                opacity:.08,
                offset:.16
            },
            {
                opacity:.48,
                offset:.24
            },
            {
                opacity:0
            }
        ],
        {
            duration:
                duration*.95,

            easing:
                "steps(5,end)"
        }
    );


    /*
       Nettoyage.
    */

    setTimeout(()=>{

        if(svg.parentNode)
            svg.remove();

        if(bg.parentNode)
            bg.remove();

    },duration+100);


    /*
       Petite chance d'avoir un
       SECOND coup immédiatement.

       C'est ce qui donne l'impression
       d'une vraie foudre qui crépite.
    */

    if(
        Math.random()<.62
    ){

        const secondDelay=
            70+
            Math.random()*150;


        setTimeout(()=>{

            if(
                document.body.contains(card)
            ){

                createLightning(card);

            }

        },secondDelay);

    }

}


/* =========================================================
   ⚡ BOUCLE ALÉATOIRE
   ========================================================= */

function startLightning(card){

    if(
        card.dataset.lightningStarted==="1"
    )
        return;


    card.dataset.lightningStarted="1";


    function nextFlash(){

        if(
            !document.body.contains(card)
        ){

            card.dataset.lightningStarted="0";

            return;

        }


        /*
           Beaucoup de variation.

           Certaines cartes peuvent rester
           calmes quelques secondes.

           Puis BAM ⚡️
        */

        const delay=
            1200+
            Math.random()*4200;


        setTimeout(()=>{

            if(
                !document.body.contains(card)
            ){

                card.dataset.lightningStarted="0";

                return;

            }


            createLightning(card);


            nextFlash();

        },delay);

    }


    /*
       Décalage initial différent
       pour chaque carte.
    */

    setTimeout(
        nextFlash,
        500+
        Math.random()*3500
    );

}

/* =========================================================
   NORMALISATION
   ========================================================= */

function normalize(text){

    return String(
        text ?? ""
    )

    .toLocaleLowerCase(
        "fr-FR"
    )

    .normalize(
        "NFKD"
    )

    .replace(
        /[\u0300-\u036f]/g,
        ""
    )

    .replace(
        /[’']/g,
        ""
    )

    .replace(
        /[-_]/g,
        " "
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();

}


/* =========================================================
   RECHERCHE
   ========================================================= */

function search(text){

    const n=
        normalize(text);


    if(!n){

        results.classList.remove(
            "show"
        );


        setTimeout(()=>{

            results.style.display=
                "none";

        },300);


        backBox.style.display=
            "none";

        return;

    }


    const words=
        n.split(" ")
        .filter(Boolean);


    let rows=

        DATA

        .map(item=>{

            const name=
                normalize(
                    item.name
                );

            const phone=
                normalize(
                    item.phone
                );

            const category=
                normalize(
                    item.category
                );

            const type=
                normalize(
                    item.type
                );

            const assistant=
                normalize(
                    item.assistant
                );

            const services=
                normalize(
                    item.services
                );

            const country=
                normalize(
                    item.pays
                );


            const searchable=[

                name,
                phone,
                category,
                type,
                assistant,
                services,
                country

            ].join(" ");


            const searchableCompact=
                searchable.replace(
                    /\s/g,
                    ""
                );


            const matches=
                words.every(
                    word=>

                        searchable.includes(
                            word
                        )

                        ||

                        searchableCompact.includes(
                            word.replace(
                                /\s/g,
                                ""
                            )
                        )

                );


            if(!matches)
                return null;


            let score=0;


            words.forEach(
                word=>{

                if(
                    name===word
                )
                    score+=100;

                else if(
                    name.startsWith(
                        word
                    )
                )
                    score+=70;

                else if(
                    name.includes(
                        word
                    )
                )
                    score+=50;


                if(
                    category===word
                )
                    score+=40;

                else if(
                    category.includes(
                        word
                    )
                )
                    score+=25;


                if(
                    type.includes(
                        word
                    )
                )
                    score+=20;


                if(
                    assistant.includes(
                        word
                    )
                )
                    score+=15;


                if(
                    services.includes(
                        word
                    )
                )
                    score+=10;


                if(
                    phone.includes(
                        word
                    )
                )
                    score+=10;

            });


            return {
                item,
                score
            };

        })

        .filter(Boolean);


    rows.sort(
        (a,b)=>{

        if(
            b.score!==a.score
        )
            return b.score-a.score;


        return a.item.name.localeCompare(
            b.item.name,
            "fr",
            {
                sensitivity:"base"
            }
        );

    });


    rows=
        rows.map(
            x=>x.item
        );


    render(rows);

}


q.addEventListener(
    "input",
    e=>{
        search(
            e.target.value
        );
    }
);

cats.addEventListener(
    "click",
    e=>{

        const card=
            e.target.closest(
                ".card"
            );


        if(!card)
            return;


        const key=
            card.dataset.cat;


        let rows;


        if(
            key==="ASSURANCE"
        ){

            rows=
                DATA.filter(
                    x=>

                        x.category.includes(
                            "ASSUR"
                        )

                        ||

                        x.category.includes(
                            "COURT"
                        )

                        ||

                        x.type
                            .toUpperCase()
                            .includes(
                                "ASSUR"
                            )

                        ||

                        x.assistant
                            .toUpperCase()
                            .includes(
                                "ASSUR"
                            )

                );

        }

        else{

            rows=
                DATA.filter(
                    x=>
                        x.category===key
                );

        }


        rows.sort(
            (a,b)=>{

            if(
                a.pays==="FR"
                &&
                b.pays!=="FR"
            )
                return -1;


            if(
                a.pays!=="FR"
                &&
                b.pays==="FR"
            )
                return 1;


            return a.name.localeCompare(
                b.name,
                "fr",
                {
                    sensitivity:"base"
                }
            );

        });


        results.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );


        backBtn.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );


        cats.classList.add(
            "hide"
        );


        setTimeout(()=>{

            cats.style.display=
                "none";


            render(
                rows,
                key
            );


            results.classList.add(
                "show"
            );

        },300);

    }
);


/* =========================================================
   DRAWER
   ========================================================= */

const drawer=
    document.getElementById(
        "drawer"
    );


list.addEventListener(
    "click",
    e=>{

        if(
            e.target.closest(
                ".call"
            )
        )
            return;


        const row=
            e.target.closest(
                ".row"
            );


        if(!row)
            return;


        const item=
            current[
                row.dataset.i
            ];


        applyCategoryColor(
            drawer,
            item.category
        );


        document.getElementById(
            "d-name"
        ).textContent=
            item.name;


        document.getElementById(
            "d-cat"
        ).textContent=
            item.category;


        document.getElementById(
            "d-tel"
        ).textContent=
            item.phone;


        document.getElementById(
            "d-call"
        ).href=
            "tel:"+item.phone;


        document.getElementById(
            "d-type"
        ).textContent=
            item.type;


        document.getElementById(
            "d-assist"
        ).textContent=
            item.assistant;


        document.getElementById(
            "d-country"
        ).textContent=
            item.pays;


        const typeBox=
            document.getElementById(
                "typeBox"
            );


        const assistBox=
            document.getElementById(
                "assistBox"
            );


        const addressBox=
            document.getElementById(
                "addressBox"
            );


        const emailBox=
            document.getElementById(
                "emailBox"
            );


        const servicesBox=
            document.getElementById(
                "servicesBox"
            );


        const countryBox=
            document.getElementById(
                "countryBox"
            );


        const availableBox=
            document.getElementById(
                "availableBox"
            );


        typeBox.style.display=
            "block";

        assistBox.style.display=
            "block";

        addressBox.style.display=
            "none";

        emailBox.style.display=
            "none";

        servicesBox.style.display=
            "none";


        if(
            item.category==="GARAGE"
        ){

            typeBox.style.display=
                "none";

            assistBox.style.display=
                "none";

            countryBox.style.display=
                "none";

            availableBox.style.display=
                "none";

            addressBox.style.display=
                "block";

            emailBox.style.display=
                "block";

            servicesBox.style.display=
                "block";

        }

        else{

            typeBox.style.display=
                "block";

            assistBox.style.display=
                "block";

            countryBox.style.display=
                "block";

            availableBox.style.display=
                "block";

            addressBox.style.display=
                "none";

            emailBox.style.display=
                "none";

            servicesBox.style.display=
                "none";

        }


        /* =================================================
           ADRESSE
           ================================================= */

        const address=
            document.getElementById(
                "d-address"
            );


        address.textContent=
            item.adresse ||
            "—";


        if(
            item.adresse
        ){

            address.href=
                "https://maps.apple.com/?q="+
                encodeURIComponent(
                    item.adresse
                );


            address.style.color=
                getCategoryColor(
                    item.category
                );


            address.style.textDecoration=
                "none";

        }

        else{

            address.removeAttribute(
                "href"
            );

        }


        /* =================================================
           EMAIL
           ================================================= */

        const email=
            document.getElementById(
                "d-email"
            );


        email.textContent=
            item.email ||
            "—";


        email.style.cursor=
            "default";


        email.onclick=
            async()=>{

            if(
                !item.email
            )
                return;


            try{

                await navigator.clipboard
                    .writeText(
                        item.email
                    );


                const old=
                    email.textContent;


                email.textContent=
                    "✓ Copié";


                setTimeout(()=>{

                    email.textContent=
                        old;

                },1200);

            }

            catch(e){

                console.warn(
                    "Copie impossible :",
                    e
                );

            }

        };


        /* =================================================
           SERVICES
           ================================================= */

        document.getElementById(
            "d-services"
        ).textContent=
            item.services;


        /* =================================================
           OUVERTURE
           ================================================= */

        drawer.classList.add(
            "show"
        );

    }
);


/* =========================================================
   FERMETURE DRAWER
   ========================================================= */

document.getElementById(
    "closeDrawer"
).onclick=()=>{

    drawer.classList.remove(
        "show"
    );

};


/* =========================================================
   RETOUR
   ========================================================= */

backBtn.onclick=()=>{

    q.value="";


    results.classList.remove(
        "show"
    );


    setTimeout(()=>{

        results.style.display=
            "none";

    },300);


    backBox.style.display=
        "none";


    list.innerHTML="";


    cats.style.display=
        "grid";


    results.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );


    backBtn.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );


    /*
       On recrée complètement les cartes
       afin de réinitialiser les éclairs.
    */

    renderCategories(
        secretMode
        ? SECRET_CATEGORIES
        : CATEGORIES
    );


    setTimeout(()=>{

        cats.classList.remove(
            "hide"
        );

    },20);


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};

</script>
