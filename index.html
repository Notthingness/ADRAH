];

let DATA = [];
let current = [];

  IT: 'Italie',
  CH: 'Suisse',
  UK: 'Royaume-Uni',
  PT: 'Portugal',

const dAddress = document.getElementById('d-address');

const dEmail = document.getElementById('d-email');

dEmail.addEventListener('click', async (e) => {

  e.preventDefault();
  e.stopPropagation();

  if(!dEmail.textContent) return;

  try{

    await navigator.clipboard.writeText(
      dEmail.textContent.trim()
    );

    const old = dEmail.textContent;

    dEmail.textContent = '✓ Copié';

    setTimeout(() => {
      dEmail.textContent = old;
    }, 1000);

  }catch(err){
    console.error(err);
  }

});
     
// FAVORIS

const KEY = 'adrah:favs';

const getFavs = () =>
JSON.parse(localStorage.getItem(KEY) || '[]');

const saveFavs = arr =>
localStorage.setItem(KEY, JSON.stringify(arr));

const isFav = item =>
getFavs().some(x =>
x.name === item.name &&
(x.phone || '') === (item.phone || '')
);

const toggleFav = item => {

  const favs = getFavs();

  const idx = favs.findIndex(x =>
    x.name === item.name &&
    (x.phone || '') === (item.phone || '')
  );

  if(idx > -1){

    favs.splice(idx,1);

  } else {

    favs.push(item);

  }

  saveFavs(favs);

};

Promise.allSettled([
  fetch('data.json').then(r => r.json()),
  fetch('data2.json').then(r => r.json()),
  fetch('data3.json').then(r => r.json()),
  fetch('garage.json').then(r => r.json())
]).then(results => {

  const arr1 = results[0].status === "fulfilled" ? results[0].value : [];
  const arr2 = results[1].status === "fulfilled" ? results[1].value : [];
  const arr3 = results[2].status === "fulfilled" ? results[2].value : [];
  const arr4 = results[3].status === "fulfilled" ? results[3].value : [];

  DATA = [...arr1, ...arr2, ...arr3, ...arr4].map(x => ({
    type: (x.type || '').trim().toUpperCase(),
    name: x.nom || x.name || '',
    assistant: x.assisteur || x.assistant || '',
    phone: String(x.telephone || x.phone || '')
      .replace(/\s+/g,' ')
      .trim(),

    category: (x.categorie || x.category || '').trim().toUpperCase(),

    extra: x.extra || '',
    adresse: x.adresse || '',
    email: x.email || '',
    services: x.services || '',
    logo: x.logo || '',
    pourboire: x.pourboire || false,
    country: (x.pays || x.country || 'FR').toUpperCase()
  }));

  // 🔥 SUPPRESSION DOUBLONS (ICI)
  DATA = [...new Map(
    DATA.map(item => [
      `${item.name.toLowerCase().trim()}|${item.phone.replace(/\D/g,'')}`,
      item
    ])
  ).values()];

});

  item.type,

  item.category,

  item.assistant,

  item.phone,

  item.extra,

  item.services

].join(' ').toLowerCase();

}

listEl.innerHTML = rows.map((r,i)=>{

class="btn btn-call"
href="tel:${(r.phone || '').replace(/\s+/g,'')}"
onclick="event.stopPropagation();">

}
    
function search(text){

  const n = text.trim().toLowerCase();

  if(!n){
    resultsEl.classList.add('hidden');
    backTop.classList.add('hidden');
    return;
  }

  // Détection pays
  let detectedCountry = null;

  for (const key in countryMap) {
    if (n.includes(key)) {
      detectedCountry = countryMap[key];
      break;
    }
  }

  // Nettoyage texte
  let cleanedText = n;

  for (const key in countryMap) {
    cleanedText = cleanedText.replace(
      new RegExp(`\\b${key}\\b`, 'g'),
      ''
    );
  }

  cleanedText = cleanedText.trim();

  const rows = DATA.filter(d => {

    const hay = [
  d.name,
  d.type,
  d.category,
  d.assistant,
  d.phone,
  d.extra,
  d.services,
  d.country
]
    .join(' ')
    .toLowerCase();

    const matchText = cleanedText
      ? hay.includes(cleanedText)
      : true;

    const matchCountry = detectedCountry
      ? d.country.toUpperCase() === detectedCountry
      : true;

    return matchText && matchCountry;
  });

  hint.textContent = detectedCountry
    ? `Pays : ${detectedCountry}`
    : `Recherche globale`;

  render(rows);

  setTimeout(() => {
    resultsEl.scrollIntoView({
      behavior:'smooth',
      block:'start'
    });
  }, 80);

  backTop.classList.add('hidden');
}

// CLICK CATEGORIES

cats.addEventListener('click', e => {

  const btn = e.target.closest('[data-cat]');

  if(!btn) return;

  categoryOpened = true;

  const key = btn.dataset.cat;

  const rows = DATA
.filter(d => {

  if (key === "ASSURANCE") {

  return d.category === "ASSURANCE" ||
         d.category === "COURTIER" ||
         d.type === "ASSURANCE" ||
         d.type === "COURTIER";

}

  return d.category === key || d.type === key;

})
  .sort((a, b) => {

  const countryA = (a.country || 'FR').toUpperCase();
  const countryB = (b.country || 'FR').toUpperCase();

  // 🇫🇷 France prioritaire
  if (countryA === 'FR' && countryB !== 'FR') return -1;
  if (countryA !== 'FR' && countryB === 'FR') return 1;

  // Alphabetique
  return a.name.localeCompare(
    b.name,
    'fr',
    { sensitivity:'base' }
  );

})
  .slice(0, 2000)

  hint.textContent = key;

  render(rows);
  
  categoryOpened = true;
  backTop.classList.remove('hidden');

  resultsEl.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });

});
