<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADRAH">
<link rel="apple-touch-icon" href="icon.PNG">
<title>ADRAH</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   VARIABLES GÉNÉRALES
   ========================================================= */
:root{
    --blue:#005BFF;
    --cyan:#00a2ff;
    --glass:rgba(0,0,0,.55);
    /* Couleur de secours */
    --cat-color:#00a2ff;
}
*{
    box-sizing:border-box;
}
body{
    margin:0;
    min-height:100vh;
    font-family:Inter,sans-serif;
    color:white;
    background:#05070b;
    overflow-x:hidden;
}
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,10,30,.55)
    ),
    url("fond-adrah.PNG");
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    z-index:0;
    pointer-events:none;
}
.app{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:auto;
    padding:20px;
}
/* =========================================================
   RECHERCHE
   ========================================================= */
.search input{
    width:100%;
    height:62px;
    border-radius:22px;
    border:2px solid var(--blue);
    background:rgba(0,0,0,.6);
    color:white;
    font-size:18px;
    font-weight:900;
    text-align:center;
    box-shadow:
        0 0 10px var(--blue),
        0 0 35px rgba(0,91,255,.6);
}
.search input::placeholder{
    color:#9ed2ff;
}
/* =========================================================
   TITRES
   ========================================================= */
h2{
    font-size:15px;
    color:#00a2ff;
    text-shadow:
        0 0 10px #005BFF;
}
   
#count{
    color:#ffffff;
    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}   
   
/* =========================================================
   GRILLE
   ========================================================= */
.grid{
    display:grid;
    gap:16px;
    transition:.35s ease;
    opacity:1;
    transform:translateX(0);
}
.grid.hide{
    opacity:0;
    transform:translateX(-60px);
    pointer-events:none;
}
/* =========================================================
   ANIMATION DES RÉSULTATS
   ========================================================= */
#results{
    margin-top:25px;
    transition:.35s ease;
    opacity:0;
    transform:translateX(60px);
}
#results.show{
    opacity:1;
    transform:translateX(0);
}
/* =========================================================
   CARTES DE CATÉGORIES
   ========================================================= */
.card{
    position:relative;
    display:flex;
    align-items:center;
    gap:20px;
    padding:22px;
    min-height:120px;
    border-radius:30px;
    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 80%
            ),
            rgba(0,0,0,.68)
        );
    border:1px solid var(--cat-color);
    box-shadow:
        0 0 15px var(--cat-color),
        0 0 40px color-mix(
            in srgb,
            var(--cat-color),
            transparent 60%
        ),
        inset 0 0 30px rgba(255,255,255,.04),
        inset 0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );
    transition:.25s;
    overflow:hidden;
}
.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:30px;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.03)
        );
    pointer-events:none;
}
.card::after{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:60%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );
    transform:skewX(-25deg);
    animation:shine 5s infinite;
    pointer-events:none;
}
.card:hover{
    transform:translateY(-2px);
}
.card i{
    position:relative;
    z-index:1;
    font-size:45px;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);
}
.card h3{
    position:relative;
    z-index:1;
    margin:0;
    font-size:30px;
    font-weight:900;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);
    word-break:break-word;
}
.card span{
    position:relative;
    z-index:1;
    color:var(--cat-color);
    text-shadow:
        0 0 10px var(--cat-color);
}
/* =========================================================
   RÉSULTATS
   ========================================================= */
.row{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 18px;
    min-height:95px;
    margin-bottom:15px;
    border-radius:25px;
    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 92%
            ),
            rgba(0,0,0,.55)
        );
    border:1px solid var(--cat-color);
    box-shadow:
        0 0 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 50%
        );
    transition:.25s;
}
.row:hover{
    transform:translateY(-1px);
}
.row > div:first-child{
    flex:1;
    min-width:0;
}
.tip-slot{
    display:flex;
    align-items:center;
    height:22px;
    margin-top:4px;
}
.tip-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(255,213,74,.12);
    border:1px solid rgba(255,213,74,.45);
    color:#FFD54A;
    font-size:12px;
    font-weight:700;
    box-shadow:
        0 0 10px rgba(255,213,74,.15);
}
.tip-label i{
    font-size:14px;
}
.title{
    display:flex;
    align-items:flex-end;
    min-height:26px;
    font-size:18px;
    font-weight:900;

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}
   
.sub{
    display:flex;
    align-items:flex-start;
    min-height:22px;
    margin-top:2px;
    color:
        color-mix(
            in srgb,
            var(--cat-color),
            white 30%
        );
    font-weight:700;
    line-height:1.2;
    overflow-wrap:anywhere;
    text-shadow:
        0 0 8px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}
/* =========================================================
   BOUTON APPEL DES RÉSULTATS
   ========================================================= */
.call{
    width:52px;
    height:52px;
    min-width:52px;
    min-height:52px;
    flex:0 0 52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cat-color);
    color:white;
    font-size:26px;
    text-decoration:none;
    box-shadow:
        0 0 25px var(--cat-color);
}
/* =========================================================
   BOUTON APPEL DU DRAWER
   ========================================================= */
#d-call{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    height:58px;
    margin:20px 0;
    border-radius:22px;
    background:
        linear-gradient(
            180deg,
            color-mix(
                in srgb,
                var(--cat-color),
                white 15%
            ),
            var(--cat-color)
        );
    color:white;
    font-size:17px;
    font-weight:900;
    text-decoration:none;
    box-shadow:
        0 6px 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        ),
        0 0 30px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );
    transition:.25s;
}
#d-call:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 35px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}
#d-call i{
    font-size:22px;
}
/* =========================================================
   INFOS DU DRAWER
   ========================================================= */
.info-value a{
    color:var(--cat-color) !important;
    text-decoration:none !important;
    -webkit-text-decoration:none;
    text-decoration-line:none;
    text-shadow:
        0 0 10px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );
}
#d-services{
    white-space:pre-wrap;
    line-height:1.45;
    font-size:20px;
}
#d-email{
    overflow-wrap:anywhere;
    text-decoration:none !important;
    color:var(--cat-color) !important;
    -webkit-text-decoration:none !important;
    text-decoration-line:none !important;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}
#d-email::selection{
    background:transparent;
}
#d-address{
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}
/* =========================================================
   BOUTON RETOUR
   ========================================================= */
.back-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:20px;
    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );
    border:2px solid var(--cat-color);
    color:white;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
    transition:.2s;
}
.back-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 20%
        );
}
/* =========================================================
   DRAWER
   ========================================================= */
.drawer{
    --cat-color:#00a2ff;
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:min(420px,95vw);
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(20px);
    border-left:2px solid var(--cat-color);
    transform:translateX(100%);
    transition:.3s;
    z-index:999;
    padding:25px;
    overflow:auto;
    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        );
}
.drawer.show{
    transform:translateX(0);
}
/* =========================================================
   DRAWER — COULEUR AUTOMATIQUE
   ========================================================= */
.drawer #d-name{
    color:#ffffff;
    text-shadow:
        0 0 5px #ffffff,
        0 0 15px rgba(255,255,255,.75),
        0 0 30px rgba(255,255,255,.35);
}
.drawer #d-cat{
    color:var(--cat-color);
    text-shadow:
        0 0 10px var(--cat-color);
}
.drawer .info-value{
    color:var(--cat-color);
    text-shadow:
        0 0 12px var(--cat-color);
}
/* =========================================================
   FERMETURE DRAWER
   ========================================================= */
.close{
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:50%;
    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 92%
        );
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:.25s;
    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );
}
.close:hover{
    transform:scale(1.08);
    background:var(--cat-color);
}
/* =========================================================
   CARTES D'INFORMATIONS
   ========================================================= */
.info{
    margin-top:30px;
}
.info-box{
    padding:18px 0;
    border:none;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:none;
    box-shadow:none;
    border-radius:0;
}
.info-box:last-child{
    border-bottom:none;
}
.info-title{
    color:#9db8d7;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:15px;
    font-weight:700;
    margin-bottom:8px;
}
.info-value{
    color:var(--cat-color);
    font-size:22px;
    font-weight:900;
    text-shadow:
        0 0 12px var(--cat-color);
}
#d-name{
    font-size:36px;
    font-weight:900;
    margin:10px 0 0;
    line-height:1.15;
    text-align:center;
    color:var(--cat-color);
    text-shadow:
        0 0 10px var(--cat-color);
}
#d-cat{
    margin:8px 0 20px;
    font-size:17px;
    font-weight:800;
    text-align:center;
    color:var(--cat-color);
    text-shadow:
        0 0 10px var(--cat-color);
}
/* =========================================================
   ANIMATION SHINE
   ========================================================= */
@keyframes shine{
    0%{
        left:-150%;
    }
    100%{
        left:200%;
    }
}
</style>
</head>
<body>
<div class="app">
<div class="search">
<input id="q" placeholder="rechercher">
</div>
<h2 id="secretTrigger">
CATÉGORIES
</h2>
<div class="grid" id="cats"></div>
<section id="results" style="display:none">
<div id="backBox" style="display:none; margin:20px 0;">
    <button id="backBtn" class="back-btn">
        <i class="ph ph-arrow-left"></i>
        Retour aux catégories
    </button>
</div>
<h2 id="count"></h2>
<div id="list"></div>
</section>
<!-- DRAWER DETAIL -->
<aside id="drawer" class="drawer">
<button class="close" id="closeDrawer">
    <i class="ph ph-arrow-left"></i>
</button>
<h1 id="d-name"></h1>
<h3 id="d-cat"></h3>
<a id="d-call" class="call">
    <span id="d-tel"></span>
</a>
<div class="info">
<div id="typeBox" class="info-box">
    <div class="info-title">
        Type
    </div>
    <div id="d-type" class="info-value"></div>
</div>
<div id="assistBox" class="info-box">
    <div class="info-title">
        Assisteur
    </div>
    <div id="d-assist" class="info-value"></div>
</div>
<div id="countryBox" class="info-box">
    <div class="info-title">
        Pays
    </div>
    <div id="d-country" class="info-value"></div>
</div>
<div id="availableBox" class="info-box">
    <div class="info-title">
        Disponibilité
    </div>
    <div class="info-value">
        24h/24 • 7j/7
    </div>
</div>
<div id="addressBox" class="info-box">
    <div class="info-title">
        Adresse
    </div>
    <div class="info-value">
        <a id="d-address" target="_blank"></a>
    </div>
</div>
<div id="emailBox" class="info-box">
    <div class="info-title">
        Email
    </div>
    <div class="info-value" id="d-email"></div>
</div>
<div id="servicesBox" class="info-box">
    <div class="info-title">
        Services
    </div>
    <div class="info-value" id="d-services"></div>
</div>
</div>
</aside>
<script>
/* =========================================================
   COULEURS DES CATÉGORIES
   =========================================================
   ⭐ C'EST LE SEUL ENDROIT À MODIFIER
   SI TU VEUX CHANGER UNE COULEUR.
   Tout le reste du site récupère automatiquement
   la couleur définie ici.
   ========================================================= */
const CATEGORY_COLORS = {
    /* CATÉGORIES NORMALES */
    VL:"#2E7DFF",
    PL:"#2E7DFF",
    MOTO:"#2E7DFF",
    LOCATION:"#2E7DFF",
    ASSURANCE:"#2E7DFF",
    GARAGE:"#2E7DFF",
    /* CATÉGORIES SECRÈTES */
    POLICE:"#00B7FF",
    GENDARMERIE:"#2E7DFF",
    POMPIERS:"#ff1e1e",
    SAMU:"#00bfa5",
    AUTOROUTE:"#ffcc00",
    ADRAH:"#00a2ff"
};
/* =========================================================
   FONCTION CENTRALE DE DÉTECTION DE COULEUR
   ========================================================= */
function getCategoryColor(category){
    const key = String(category || "")
        .toUpperCase()
        .trim();
    return CATEGORY_COLORS[key] || "#00a2ff";
}
/* =========================================================
   APPLICATION AUTOMATIQUE D'UNE COULEUR
   ========================================================= */
function applyCategoryColor(element,category){
    if(!element)
        return;
    const key = String(category || "")
        .toUpperCase()
        .trim();
    const color = getCategoryColor(key);
    element.style.setProperty(
        "--cat-color",
        color
    );
    element.dataset.cat = key;
}
/* =========================================================
   CATÉGORIES NORMALES
   ========================================================= */
const CATEGORIES=[
{
    key:"VL",
    label:"VL",
    sub:"Véhicule léger",
    icon:"ph-car"
},
{
    key:"PL",
    label:"PL",
    sub:"Poids lourd",
    icon:"ph-truck"
},
{
    key:"MOTO",
    label:"MOTO",
    sub:"Deux roues",
    icon:"ph-motorcycle"
},
{
    key:"LOCATION",
    label:"LOCATION",
    sub:"Location",
    icon:"ph-key"
},
{
    key:"ASSURANCE",
    label:"ASSURANCE",
    sub:"Assurance",
    icon:"ph-shield"
},
{
    key:"GARAGE",
    label:"GARAGE",
    sub:"Partenaires",
    icon:"ph-wrench"
}
];
/* =========================================================
   CATÉGORIES SECRÈTES
   ========================================================= */
const SECRET_CATEGORIES=[
{
    key:"POLICE",
    label:"POLICE",
    sub:"Police Nationale",
    icon:"ph-shield"
},
{
    key:"GENDARMERIE",
    label:"GENDARMERIE",
    sub:"Brigades",
    icon:"ph-shield-star"
},
{
    key:"POMPIERS",
    label:"POMPIERS",
    sub:"SDIS",
    icon:"ph-fire-truck"
},
{
    key:"SAMU",
    label:"SAMU",
    sub:"Urgences",
    icon:"ph-ambulance"
},
{
    key:"AUTOROUTE",
    label:"AUTOROUTE",
    sub:"DIR / PC",
    icon:"ph-road-horizon"
},
{
    key:"ADRAH",
    label:"ADRAH",
    sub:"Numéros utiles",
    icon:"ph-phone-call"
}
];
let DATA=[];
let current=[];
const cats=document.getElementById("cats");
/* =========================================================
   AFFICHAGE DES CATÉGORIES
   ========================================================= */
function renderCategories(data){
    cats.innerHTML = data.map(c=>`
        <div
            class="card"
            data-cat="${c.key}"
            style="--cat-color:${getCategoryColor(c.key)}"
        >
            <i class="ph ${c.icon}"></i>
            <div>
                <h3>${c.label}</h3>
                <span>${c.sub}</span>
            </div>
        </div>
    `).join("");
}
renderCategories(CATEGORIES);
/* =========================================================
   MENU SECRET
   ========================================================= */
let secretClicks = 0;
let secretMode = false;
const secretTrigger =
    document.getElementById("secretTrigger");
secretTrigger.onclick = ()=>{
    secretClicks++;
    setTimeout(()=>{
        secretClicks=0;
    },800);
    if(secretClicks>=2){
        secretClicks=0;
        secretMode=!secretMode;
        if(secretMode){
            cats.classList.add("secret-mode");
        }else{
            cats.classList.remove("secret-mode");
        }
        cats.classList.add("hide");
        setTimeout(()=>{
            renderCategories(
                secretMode
                    ? SECRET_CATEGORIES
                    : CATEGORIES
            );
            cats.classList.remove("hide");
        },300);
    }
};
/* =========================================================
   CHARGEMENT DES JSON
   ========================================================= */
const fichiers=[
    "data.json",
    "data2.json",
    "data3.json",
    "garage.json",
    "adrah.json",
    "police.json",
    "gendarmerie.json",
    "autoroute.json",
    "pompiers.json",
    "samu.json"
];
Promise.all(
    fichiers.map(fichier=>{
        console.log(
            "Chargement :",
            fichier
        );
        return fetch(fichier)
        .then(r=>{
            if(!r.ok){
                throw new Error(
                    fichier +
                    " introuvable"
                );
            }
            return r.text();
        })
        .then(txt=>{
            if(!txt.trim()){
                console.warn(
                    fichier +
                    " est vide → ignoré"
                );
                return [];
            }
            try{
                return JSON.parse(txt);
            }
            catch(e){
                throw new Error(
                    "Erreur JSON dans "
                    + fichier
                    + " : "
                    + e.message
                );
            }
        });
    })
)
.then(files=>{
    DATA=files.flat();
    DATA=DATA.map(x=>({
        name:
            (
                x.nom ||
                x.name ||
                ""
            ).trim(),
        phone:String(
            x.telephone ||
            x.phone ||
            x.tel ||
            x.numero ||
            ""
        ),
        category:String(
            x.categorie ||
            x.category ||
            x.service ||
            ""
        )
        .toUpperCase()
        .trim(),
        pays:String(
            x.pays ||
            ""
        )
        .toUpperCase()
        .trim(),
        type:String(
            x.type ||
            ""
        ).trim(),
        assistant:String(
            x.assisteur ||
            x.assistant ||
            ""
        ).trim(),
        email:x.email || "",
        services:x.services || "",
        adresse:x.adresse || "",
        pourboire:x.pourboire === true
    }));
    DATA.sort((a,b)=>
        a.name.localeCompare(
            b.name,
            "fr"
        )
    );
    console.log(
        "Données prêtes :",
        DATA.length
    );
})
.catch(err=>{
    document.body.innerHTML += `
        <div style="
            position:fixed;
            bottom:10px;
            left:10px;
            right:10px;
            background:red;
            color:white;
            padding:20px;
            border-radius:15px;
            font-size:16px;
            z-index:99999;
        ">
            ❌ ERREUR : ${err.message}
        </div>
    `;
});
/* =========================================================
   ÉLÉMENTS
   ========================================================= */
const q=
    document.getElementById("q");
const results=
    document.getElementById("results");
const list=
    document.getElementById("list");
const count=
    document.getElementById("count");
const backBox=
    document.getElementById("backBox");
const backBtn=
    document.getElementById("backBtn");
/* =========================================================
   RENDU DES RÉSULTATS
   ========================================================= */
function render(rows,category=""){
    current=rows;
    const selectedColor =
        getCategoryColor(category);
    /*
       Si on est dans une catégorie précise,
       le conteneur récupère sa couleur.
       Si recherche générale :
       chaque .row possède sa propre couleur.
    */
    results.style.setProperty(
        "--cat-color",
        selectedColor
    );
    list.dataset.cat=category;
    /* =====================================================
       AUCUN RÉSULTAT
       ===================================================== */
    if(!rows.length){
        results.style.display="block";
        results.classList.add("show");
        backBox.style.display="block";
        count.textContent="0 résultat";
        list.innerHTML=`
            <div
                class="row"
                style="--cat-color:${selectedColor}"
            >
                <div>
                    <div class="title">
                        Aucun résultat
                    </div>
                    <div class="sub">
                        Cette catégorie est vide.
                    </div>
                </div>
            </div>
        `;
        return;
    }
    results.style.display="block";
    results.classList.add("show");
    backBox.style.display="block";
    count.textContent=
        rows.length+
        " résultat(s)";
    /* =====================================================
       CRÉATION DES ROWS
       ===================================================== */
    list.innerHTML=rows.map((r,i)=>`
        <div
    class="row"
    data-i="${i}"
    data-cat="${r.category}"
    style="--cat-color:${getCategoryColor(category || r.category)}"
>
            <div>
                <div class="title">
                    ${r.name}
                </div>
                <div class="sub">
                    ${r.category}
                    ${
                        r.category !== "GARAGE"
                            ? " · " + r.assistant
                            : ""
                    }
                </div>
                <div class="tip-slot">
                    ${
                        r.category === "GARAGE"
                        &&
                        r.pourboire
                            ? `
                                <div class="tip-label">
                                    <i class="ph ph-coins"></i>
                                    Pourboire
                                </div>
                              `
                            : ""
                    }
                </div>
            </div>
            <a
                class="call"
                href="tel:${r.phone}"
            >
                <i class="ph ph-phone"></i>
            </a>
        </div>
    `).join("");
    setTimeout(()=>{
        results.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    },100);
}
/* =========================================================
   NORMALISATION RECHERCHE
   ========================================================= */
function normalize(text){
    return String(text ?? "")
        .toLocaleLowerCase("fr-FR")
        .normalize("NFKD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[’']/g,
            ""
        )
        .replace(
            /[-_]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}
/* =========================================================
   RECHERCHE
   ========================================================= */
function search(text){
    const n=normalize(text);
    /* Recherche vide */
    if(!n){
        results.classList.remove("show");
        setTimeout(()=>{
            results.style.display="none";
        },300);
        backBox.style.display="none";
        return;
    }
    const words=
        n.split(" ")
        .filter(Boolean);
    let rows=DATA
        .map(item=>{
            const name=
                normalize(item.name);
            const phone=
                normalize(item.phone);
            const category=
                normalize(item.category);
            const type=
                normalize(item.type);
            const assistant=
                normalize(item.assistant);
            const services=
                normalize(item.services);
            const country=
                normalize(item.pays);
            const searchable=[
                name,
                phone,
                category,
                type,
                assistant,
                services,
                country
            ].join(" ");
            const searchableCompact=
                searchable.replace(/\s/g,"");
            const matches=
                words.every(word=>
                    searchable.includes(word)
                    ||
                    searchableCompact.includes(
                        word.replace(/\s/g,"")
                    )
                );
            if(!matches)
                return null;
            /* SCORE */
            let score=0;
            words.forEach(word=>{
                /* Nom */
                if(name===word)
                    score+=100;
                else if(name.startsWith(word))
                    score+=70;
                else if(name.includes(word))
                    score+=50;
                /* Catégorie */
                if(category===word)
                    score+=40;
                else if(category.includes(word))
                    score+=25;
                /* Type */
                if(type.includes(word))
                    score+=20;
                /* Assisteur */
                if(assistant.includes(word))
                    score+=15;
                /* Services */
                if(services.includes(word))
                    score+=10;
                /* Téléphone */
                if(phone.includes(word))
                    score+=10;
            });
            return{
                item,
                score
            };
        })
        .filter(Boolean);
    rows.sort((a,b)=>{
        if(b.score!==a.score)
            return b.score-a.score;
        return a.item.name.localeCompare(
            b.item.name,
            "fr",
            {
                sensitivity:"base"
            }
        );
    });
    rows=
        rows.map(x=>x.item);
    render(rows);
}
q.addEventListener(
    "input",
    e=>{
        search(e.target.value);
    }
);
/* =========================================================
   CLIC SUR UNE CATÉGORIE
   ========================================================= */
cats.addEventListener(
    "click",
    e=>{
        const card=
            e.target.closest(".card");
        if(!card)
            return;
        const key=
            card.dataset.cat;
        let rows;
        /* ASSURANCE */
        if(key==="ASSURANCE"){
            rows=DATA.filter(x=>
                x.category.includes("ASSUR")
                ||
                x.category.includes("COURT")
                ||
                x.type
                    .toUpperCase()
                    .includes("ASSUR")
                ||
                x.assistant
                    .toUpperCase()
                    .includes("ASSUR")
            );
        }
        else{
            rows=
                DATA.filter(
                    x=>x.category===key
                );
        }
        /* TRI */
        rows.sort((a,b)=>{
            if(
                a.pays==="FR"
                &&
                b.pays!=="FR"
            )
                return -1;
            if(
                a.pays!=="FR"
                &&
                b.pays==="FR"
            )
                return 1;
            return a.name.localeCompare(
                b.name,
                "fr",
                {
                    sensitivity:"base"
                }
            );
        });
        /*
           La couleur de la catégorie
           devient immédiatement la couleur
           du système de résultats.
        */
        results.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );
        backBtn.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );
        cats.classList.add("hide");
        setTimeout(()=>{
            cats.style.display="none";
            render(
                rows,
                key
            );
            results.classList.add("show");
        },300);
    }
);
/* =========================================================
   DRAWER
   ========================================================= */
const drawer=
    document.getElementById("drawer");
list.addEventListener(
    "click",
    e=>{
        if(
            e.target.closest(".call")
        )
            return;
        const row=
            e.target.closest(".row");
        if(!row)
            return;
        const item=
            current[row.dataset.i];
        /*
           ⭐ C'EST ICI QUE LE DRAWER
           DÉTECTE AUTOMATIQUEMENT
           LA COULEUR DE LA CATÉGORIE.
        */
        applyCategoryColor(
            drawer,
            item.category
        );
        document.getElementById(
            "d-name"
        ).textContent=
            item.name;
        document.getElementById(
            "d-cat"
        ).textContent=
            item.category;
        document.getElementById(
            "d-tel"
        ).textContent=
            item.phone;
        document.getElementById(
            "d-call"
        ).href=
            "tel:"+item.phone;
        document.getElementById(
            "d-type"
        ).textContent=
            item.type;
        document.getElementById(
            "d-assist"
        ).textContent=
            item.assistant;
        document.getElementById(
            "d-country"
        ).textContent=
            item.pays;
        const typeBox=
            document.getElementById(
                "typeBox"
            );
        const assistBox=
            document.getElementById(
                "assistBox"
            );
        const addressBox=
            document.getElementById(
                "addressBox"
            );
        const emailBox=
            document.getElementById(
                "emailBox"
            );
        const servicesBox=
            document.getElementById(
                "servicesBox"
            );
        const countryBox=
            document.getElementById(
                "countryBox"
            );
        const availableBox=
            document.getElementById(
                "availableBox"
            );
        /* =================================================
           AFFICHAGE SELON CATÉGORIE
           ================================================= */
        typeBox.style.display="block";
        assistBox.style.display="block";
        addressBox.style.display="none";
        emailBox.style.display="none";
        servicesBox.style.display="none";
        if(item.category==="GARAGE"){
            typeBox.style.display="none";
            assistBox.style.display="none";
            countryBox.style.display="none";
            availableBox.style.display="none";
            addressBox.style.display="block";
            emailBox.style.display="block";
            servicesBox.style.display="block";
        }
        else{
            typeBox.style.display="block";
            assistBox.style.display="block";
            countryBox.style.display="block";
            availableBox.style.display="block";
            addressBox.style.display="none";
            emailBox.style.display="none";
            servicesBox.style.display="none";
        }
        /* =================================================
           ADRESSE
           ================================================= */
        const address=
            document.getElementById(
                "d-address"
            );
        address.textContent=
            item.adresse || "—";
        if(item.adresse){
            address.href=
                "https://maps.apple.com/?q="
                +
                encodeURIComponent(
                    item.adresse
                );
            address.style.color=
                getCategoryColor(
                    item.category
                );
            address.style.textDecoration=
                "none";
        }
        else{
            address.removeAttribute(
                "href"
            );
        }
        /* =================================================
           EMAIL
           ================================================= */
        const email=
            document.getElementById(
                "d-email"
            );
        email.style.webkitTapHighlightColor=
            "transparent";
        email.textContent=
            item.email || "—";
        email.style.cursor=
            "default";
        email.style.textDecoration=
            "none";
        email.onclick=async()=>{
            if(!item.email)
                return;
            try{
                await navigator.clipboard
                    .writeText(
                        item.email
                    );
                const old=
                    email.textContent;
                email.textContent=
                    "✓ Copié";
                setTimeout(()=>{
                    email.textContent=
                        old;
                },1200);
            }
            catch(e){
                console.warn(
                    "Copie impossible :",
                    e
                );
            }
        };
        /* =================================================
           SERVICES
           ================================================= */
        document.getElementById(
            "d-services"
        ).textContent=
            item.services;
        /* =================================================
           OUVERTURE
           ================================================= */
        drawer.classList.add(
            "show"
        );
    }
);
/* =========================================================
   FERMETURE DRAWER
   ========================================================= */
document.getElementById(
    "closeDrawer"
).onclick=()=>{
    drawer.classList.remove(
        "show"
    );
};
/* =========================================================
   RETOUR AUX CATÉGORIES
   ========================================================= */
backBtn.onclick=()=>{
    q.value="";
    results.classList.remove(
        "show"
    );
    setTimeout(()=>{
        results.style.display="none";
    },300);
    backBox.style.display="none";
    list.innerHTML="";
    cats.style.display="grid";
    /*
       Retour à la couleur bleue
       par défaut.
    */
    results.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );
    backBtn.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );
    setTimeout(()=>{
        cats.classList.remove(
            "hide"
        );
    },20);
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};
</script>
