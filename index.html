rel="stylesheet">


<style>

/* =========================================================
   VARIABLES
   ========================================================= */

:root{
    --blue:#005BFF;
    --cyan:#00a2ff;
    --glass:rgba(0,0,0,.55);
    --cat-color:#00a2ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,sans-serif;
    color:white;
    background:#05070b;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,10,30,.55)
        ),
        url("fond-adrah.PNG");

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    z-index:0;
    pointer-events:none;
}

.app{
    position:relative;
    z-index:1;

    max-width:560px;
    margin:auto;
    padding:20px;
}


/* =========================================================
   RECHERCHE
   ========================================================= */

.search input{
    width:100%;
    height:62px;

    border-radius:22px;
    border:2px solid var(--blue);

    background:rgba(0,0,0,.6);

    color:white;

    font-size:18px;
    font-weight:900;

    text-align:center;

    box-shadow:
        0 0 10px var(--blue),
        0 0 35px rgba(0,91,255,.6);
}

.search input::placeholder{
    color:#9ed2ff;
}


/* =========================================================
   TITRES
   ========================================================= */

h2{
    font-size:15px;
    color:#00a2ff;

    text-shadow:
        0 0 10px #005BFF;
}

#count{
    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}


/* =========================================================
   GRILLE
   ========================================================= */

.grid{
    display:grid;
    gap:16px;

    transition:.35s ease;

    opacity:1;
    transform:translateX(0);
}

.grid.hide{
    opacity:0;
    transform:translateX(-60px);
    pointer-events:none;
}


/* =========================================================
   RÉSULTATS
   ========================================================= */

#results{
    margin-top:25px;

    transition:.35s ease;

    opacity:0;
    transform:translateX(60px);
}

#results.show{
    opacity:1;
    transform:translateX(0);
}


/* =========================================================
   CARTES
   ========================================================= */

.card{
    position:relative;

    display:flex;
    align-items:center;

    gap:20px;

    padding:22px;

    min-height:120px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 80%
            ),
            rgba(0,0,0,.68)
        );

    border:1px solid var(--cat-color);

    box-shadow:
        0 0 15px var(--cat-color),

        0 0 40px
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 60%
        ),

        inset 0 0 30px rgba(255,255,255,.04),

        inset 0 0 25px
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );

    transition:.25s;

    overflow:hidden;
}

.card:hover{
    transform:translateY(-2px);
}


/* =========================================================
   ⚡ NOUVEL ÉCLAIR
   ========================================================= */

.card-lightning{
    position:absolute;

    left:-10%;
    top:-15%;

    width:120%;
    height:130%;

    z-index:2;

    pointer-events:none;

    overflow:visible;

    opacity:0;

    mix-blend-mode:screen;

    /*
       Chaque carte reçoit des valeurs
       différentes depuis le JS.
    */
    animation:
        lightningTravel
        var(--lightning-time)
        var(--lightning-delay)
        infinite;
}


/* ---------------------------------------------------------
   TRAJECTOIRE PRINCIPALE
   --------------------------------------------------------- */

.lightning-path{
    fill:none;

    stroke:#ffffff;

    stroke-width:1.4;

    stroke-linecap:round;
    stroke-linejoin:round;

    vector-effect:non-scaling-stroke;

    /*
       Le chemin est beaucoup plus long
       que nécessaire pour permettre
       le déplacement du trait.
    */

    stroke-dasharray:85 500;

    stroke-dashoffset:585;

    filter:
        drop-shadow(0 0 1px #fff)
        drop-shadow(0 0 3px #fff)
        drop-shadow(0 0 7px var(--cat-color));
}


/* ---------------------------------------------------------
   HALO IMMÉDIAT
   --------------------------------------------------------- */

.lightning-glow{
    fill:none;

    stroke:var(--cat-color);

    stroke-width:4;

    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:.45;

    vector-effect:non-scaling-stroke;

    stroke-dasharray:90 500;
    stroke-dashoffset:590;

    filter:blur(3px);
}


/* ---------------------------------------------------------
   HALO LARGE
   --------------------------------------------------------- */

.lightning-wide{
    fill:none;

    stroke:var(--cat-color);

    stroke-width:8;

    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:.14;

    vector-effect:non-scaling-stroke;

    stroke-dasharray:100 500;
    stroke-dashoffset:600;

    filter:blur(8px);
}


/* ---------------------------------------------------------
   PETITES DÉCHARGES / RICOCHETS
   --------------------------------------------------------- */

.lightning-branch{
    fill:none;

    stroke:#ffffff;

    stroke-width:.8;

    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:.9;

    vector-effect:non-scaling-stroke;

    stroke-dasharray:35 300;
    stroke-dashoffset:335;

    filter:
        drop-shadow(0 0 2px #fff)
        drop-shadow(0 0 5px var(--cat-color));
}

.lightning-branch-glow{
    fill:none;

    stroke:var(--cat-color);

    stroke-width:3.5;

    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:.4;

    vector-effect:non-scaling-stroke;

    stroke-dasharray:45 300;
    stroke-dashoffset:345;

    filter:blur(3px);
}


/* =========================================================
   ⚡ ANIMATION PRINCIPALE
   =========================================================

   IMPORTANT :

   L'éclair reste invisible longtemps.

   Lorsqu'il arrive :
   - il entre progressivement
   - traverse la carte
   - rebondit
   - accélère
   - disparaît

   Il n'y a donc plus de gros
   "FLASH → PAUSE → FLASH".
*/

@keyframes lightningTravel{

    0%{
        opacity:0;

        transform:
            translate(
                var(--lightning-x),
                var(--lightning-y)
            )
            rotate(
                var(--lightning-rotate)
            )
            scale(.94);
    }

    /* Approche */
    68%{
        opacity:0;
    }

    69%{
        opacity:.15;

        transform:
            translate(
                calc(var(--lightning-x) - 10px),
                calc(var(--lightning-y) + 2px)
            )
            rotate(
                var(--lightning-rotate)
            )
            scale(.97);
    }

    /* Entrée rapide */
    70%{
        opacity:.85;

        transform:
            translate(
                var(--lightning-x),
                var(--lightning-y)
            )
            rotate(
                var(--lightning-rotate)
            )
            scale(1);
    }

    /* Traversée */
    72%{
        opacity:1;
    }

    /* Premier ricochet */
    73.2%{
        opacity:.45;

        transform:
            translate(
                calc(var(--lightning-x) + 7px),
                calc(var(--lightning-y) - 3px)
            )
            rotate(
                calc(var(--lightning-rotate) + 1deg)
            )
            scale(1.01);
    }

    /* Deuxième rebond */
    74.1%{
        opacity:.95;

        transform:
            translate(
                calc(var(--lightning-x) - 5px),
                calc(var(--lightning-y) + 2px)
            )
            rotate(
                calc(var(--lightning-rotate) - 1deg)
            )
            scale(.995);
    }

    /* Petit claquement */
    75.3%{
        opacity:.25;
    }

    /* Dernière décharge */
    76.2%{
        opacity:.9;

        transform:
            translate(
                calc(var(--lightning-x) + 4px),
                var(--lightning-y)
            )
            rotate(
                var(--lightning-rotate)
            )
            scale(1.015);
    }

    /* Départ */
    78%{
        opacity:.15;

        transform:
            translate(
                calc(var(--lightning-x) + 16px),
                calc(var(--lightning-y) - 4px)
            )
            rotate(
                calc(var(--lightning-rotate) + 2deg)
            )
            scale(.97);
    }

    80%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   ICÔNES / TEXTE DES CARTES
   ========================================================= */

.card i{
    position:relative;

    z-index:3;

    font-size:45px;

.card h3{

    z-index:3;

    color:white;

        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);

    word-break:break-word;
}

.card span{
    position:relative;

    z-index:3;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}


/* =========================================================
   RÉSULTATS
   ========================================================= */

.row{

    display:flex;
    align-items:center;

    gap:18px;

    padding:16px 18px;

.row > div:first-child{

/* =========================================================
   POURBOIRE

.tip-slot{

    align-items:center;

    height:22px;

    margin-top:4px;
}

.tip-label{

    font-size:12px;

        0 0 10px rgba(255,213,74,.15);

.tip-label i{

/* =========================================================
   TITRE RÉSULTAT
   ========================================================= */

.title{

}

.sub{

        0 0 8px

/* =========================================================
   BOUTON APPEL
   ========================================================= */

.call{

    height:52px;

    min-width:52px;
    min-height:52px;

/* =========================================================
   BOUTON DRAWER

#d-call{

    align-items:center;

    font-size:17px;

            in srgb,
            var(--cat-color),
            transparent 55%

            var(--cat-color),

}

#d-call:hover{

    box-shadow:

            in srgb,

}

#d-call i{

/* =========================================================
   DRAWER INFOS

#d-services{

#d-email{

/* =========================================================
   RETOUR

.back-btn{
    width:100%;
    height:58px;

    border:none;

    border-radius:20px;

    background:

}

.back-btn:hover{

    box-shadow:

/* =========================================================
   DRAWER
   ========================================================= */

.drawer{
    --cat-color:#00a2ff;

    position:fixed;

    width:min(420px,95vw);

/* =========================================================

<div class="app">

<script>


/* =========================================================
   COULEURS
   ========================================================= */

const CATEGORY_COLORS = {

    VL:"#2E7DFF",
    PL:"#2E7DFF",
    MOTO:"#2E7DFF",
    LOCATION:"#2E7DFF",
    ASSURANCE:"#2E7DFF",
    GARAGE:"#2E7DFF",

    POLICE:"#00B7FF",
    GENDARMERIE:"#2E7DFF",
    POMPIERS:"#ff1e1e",
    SAMU:"#00bfa5",
    AUTOROUTE:"#ffcc00",
    ADRAH:"#00a2ff"

};


function getCategoryColor(category){

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    return CATEGORY_COLORS[key] || "#00a2ff";

}


function applyCategoryColor(
    element,
    category
){

    if(!element)
        return;

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    const color =
        getCategoryColor(key);

    element.style.setProperty(
        "--cat-color",
        color
    );

    element.dataset.cat = key;

}


/* =========================================================
   CATÉGORIES
   ========================================================= */

const CATEGORIES=[

{
    key:"VL",
    label:"VL",
    sub:"Véhicule léger",
    icon:"ph-car"
},

{
    key:"PL",
    label:"PL",
    sub:"Poids lourd",
    icon:"ph-truck"
},

{
    key:"MOTO",
    label:"MOTO",
    sub:"Deux roues",
    icon:"ph-motorcycle"

/* =========================================================
   NORMALISATION
   ========================================================= */

function normalize(text){

    return String(text ?? "")

        .toLocaleLowerCase("fr-FR")

        .normalize("NFKD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[’']/g,
            ""
        )

        .replace(
            /[-_]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   RECHERCHE
   ========================================================= */

function search(text){

    const n=normalize(text);


    if(!n){

        results.classList.remove("show");

        setTimeout(()=>{

            results.style.display="none";

        },300);

        backBox.style.display="none";

        return;

    }


    const words=
        n.split(" ")
        .filter(Boolean);


    let rows=

        DATA

        .map(item=>{

            const name=
                normalize(item.name);

            const phone=
                normalize(item.phone);

            const category=
                normalize(item.category);

            const type=
                normalize(item.type);

            const assistant=
                normalize(item.assistant);

            const services=
                normalize(item.services);

            const country=
                normalize(item.pays);


            const searchable=[

                name,
                phone,
                category,
                type,
                assistant,
                services,
                country

            ].join(" ");


            const searchableCompact=
                searchable.replace(
                    /\s/g,
                    ""
                );


            const matches=
                words.every(word=>

                    searchable.includes(word)

                    ||

                    searchableCompact.includes(
                        word.replace(
                            /\s/g,
                            ""
                        )
                    )

                );


            if(!matches)
                return null;


            let score=0;


            words.forEach(word=>{

                if(name===word)
                    score+=100;

                else if(name.startsWith(word))
                    score+=70;

                else if(name.includes(word))
                    score+=50;


                if(category===word)
                    score+=40;

                else if(category.includes(word))
                    score+=25;


                if(type.includes(word))
                    score+=20;


                if(assistant.includes(word))
                    score+=15;


                if(services.includes(word))
                    score+=10;


                if(phone.includes(word))
                    score+=10;

            });


            return{
                item,
                score
            };

        })


        .filter(Boolean);


    rows.sort((a,b)=>{

        if(b.score!==a.score)
            return b.score-a.score;


        return a.item.name.localeCompare(
            b.item.name,
            "fr",
            {
                sensitivity:"base"
            }
        );

    });


    rows=
        rows.map(x=>x.item);


    render(rows);

}


q.addEventListener(
    "input",
    e=>{
        search(e.target.value);
    }
);


/* =========================================================
   CLIC CATÉGORIE
   ========================================================= */

cats.addEventListener(
    "click",
    e=>{

        const card=
            e.target.closest(".card");


        if(!card)
            return;


        const key=
            card.dataset.cat;


        let rows;


        if(key==="ASSURANCE"){

            rows=
                DATA.filter(x=>

                    x.category.includes("ASSUR")

                    ||

                    x.category.includes("COURT")

                    ||

                    x.type
                        .toUpperCase()
                        .includes("ASSUR")

                    ||

                    x.assistant
                        .toUpperCase()
                        .includes("ASSUR")

                );

        }

        else{

            rows=
                DATA.filter(
                    x=>x.category===key
                );

        }


        rows.sort((a,b)=>{

            if(
                a.pays==="FR" &&
                b.pays!=="FR"
            )
                return -1;


            if(
                a.pays!=="FR" &&
                b.pays==="FR"
            )
                return 1;


            return a.name.localeCompare(
                b.name,
                "fr",
                {
                    sensitivity:"base"
                }
            );

        });


        results.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );


        backBtn.style.setProperty(
            "--cat-color",
            getCategoryColor(key)
        );


        cats.classList.add("hide");


        setTimeout(()=>{

            cats.style.display="none";


            render(
                rows,
                key
            );


            results.classList.add("show");

        },300);

    }
);
