<html lang="fr">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

rel="stylesheet">


<style>

/* =========================================================
   VARIABLES
   ========================================================= */

:root{
    --blue:#005BFF;
    --cyan:#00a2ff;
    --glass:rgba(0,0,0,.55);
    --cat-color:#00a2ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,sans-serif;
    color:white;
    background:#05070b;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,10,30,.55)
        ),
        url("fond-adrah.PNG");

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    z-index:0;
    pointer-events:none;
}

.app{
    position:relative;
    z-index:1;

    max-width:560px;
    margin:auto;
    padding:20px;
}


/* =========================================================
   RECHERCHE
   ========================================================= */

.search input{
    width:100%;
    height:62px;

    border-radius:22px;
    border:2px solid var(--blue);

    background:rgba(0,0,0,.6);

    color:white;

    font-size:18px;
    font-weight:900;
    text-align:center;

    outline:none;

    box-shadow:
        0 0 10px var(--blue),
        0 0 35px rgba(0,91,255,.6);
}

.search input::placeholder{
    color:#9ed2ff;
}


/* =========================================================
   TITRES
   ========================================================= */

h2{
    font-size:15px;
    color:#00a2ff;

    text-shadow:
        0 0 10px #005BFF;
}

#count{
    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}


/* =========================================================
   GRILLE
   ========================================================= */

.grid{
    display:grid;
    gap:16px;

    transition:.35s ease;

    opacity:1;
    transform:translateX(0);
}

.grid.hide{
    opacity:0;
    transform:translateX(-60px);
    pointer-events:none;
}


/* =========================================================
   RÉSULTATS
   ========================================================= */

#results{
    margin-top:25px;

    transition:.35s ease;

    opacity:0;
    transform:translateX(60px);
}

#results.show{
    opacity:1;
    transform:translateX(0);
}


/* =========================================================
   CARTES
   ========================================================= */

.card{

    position:relative;

    display:flex;
    align-items:center;

    gap:20px;

    padding:22px;

    min-height:120px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 80%
            ),
            rgba(0,0,0,.68)
        );

    border:1px solid var(--cat-color);

    box-shadow:

        0 0 15px var(--cat-color),

        0 0 40px color-mix(
            in srgb,
            var(--cat-color),
            transparent 60%
        ),

        inset 0 0 30px rgba(255,255,255,.04),

        inset 0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );

    transition:.25s;

    overflow:hidden;

    /*
       Très important :
       crée un vrai contexte de découpage
       pour les éclairs.
    */
    isolation:isolate;
}

.card:hover{
    transform:translateY(-2px);
}


/* =========================================================
   ⚡ SYSTÈME ÉCLAIRS
   ========================================================= */

/*
   Le layer occupe exactement la carte.

   Aucun débordement possible.
   Le border-radius est appliqué directement
   au conteneur.
*/

.lightning-layer{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:30px;

    pointer-events:none;

    z-index:1;

    isolation:isolate;
}


/*
   Chaque éclair SVG est positionné
   à l'intérieur du layer.
*/

.dynamic-lightning{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    pointer-events:none;

    opacity:0;

    /*
       Découpage supplémentaire.
       Cela évite absolument toute forme
       rectangulaire visible.
    */

    clip-path:
        inset(
            1px
            1px
            1px
            1px
            round 29px
        );

    border-radius:29px;

    mix-blend-mode:screen;

    transform:translateZ(0);

    will-change:opacity;
}


/* =========================================================
   ⚡ ÉCLAIR CENTRAL
   ========================================================= */

.bolt-core{

    fill:none;

    stroke:#ffffff;

    stroke-width:1.05;

    stroke-linecap:round;

    stroke-linejoin:round;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(0 0 1px #ffffff)
        drop-shadow(0 0 3px #ffffff)
        drop-shadow(0 0 7px var(--cat-color))
        drop-shadow(0 0 12px var(--cat-color));
}


/* =========================================================
   ⚡ GLOW
   ========================================================= */

.bolt-glow{

    fill:none;

    stroke:var(--cat-color);

    stroke-width:4;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.38;

    vector-effect:non-scaling-stroke;

    filter:
        blur(3px);
}


/* =========================================================
   ⚡ HALO
   ========================================================= */

.bolt-halo{

    fill:none;

    stroke:var(--cat-color);

    stroke-width:8;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.12;

    vector-effect:non-scaling-stroke;

    filter:
        blur(7px);
}


/* =========================================================
   ⚡ RAMIFICATIONS
   ========================================================= */

.bolt-branch{

    fill:none;

    stroke:#ffffff;

    stroke-width:.65;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:.72;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 0 5px var(--cat-color));
}


/* =========================================================
   ⚡ ANIMATION DU FLASH
   ========================================================= */

.lightning-flash{

    animation:
        lightningFlash
        var(--flash-time)
        ease-out
        forwards;
}


@keyframes lightningFlash{

    0%{
        opacity:0;
    }

    8%{
        opacity:.88;
    }

    15%{
        opacity:.18;
    }

    23%{
        opacity:1;
    }

    31%{
        opacity:.06;
    }

    42%{
        opacity:.76;
    }

    55%{
        opacity:.12;
    }

    68%{
        opacity:.35;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   ICÔNES CARTES
   ========================================================= */

.card > i{

    position:relative;

    z-index:10;

    font-size:45px;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);
}

.card h3{

    position:relative;

    z-index:10;

    margin:0;

    font-size:30px;

    font-weight:900;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 15px var(--cat-color),
        0 0 35px var(--cat-color);

    word-break:break-word;
}

.card span{

    position:relative;

    z-index:10;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}


/* =========================================================
   RÉSULTAT
   ========================================================= */

.row{

    position:relative;

    display:flex;
    align-items:center;

    gap:18px;

    padding:16px 18px;

    min-height:95px;

    margin-bottom:15px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--cat-color),
                transparent 92%
            ),
            rgba(0,0,0,.55)
        );

    border:1px solid var(--cat-color);

    box-shadow:
        0 0 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 50%
        );

    transition:.25s;
}

.row:hover{
    transform:translateY(-1px);
}

.row > div:first-child{
    flex:1;
    min-width:0;
}


/* =========================================================
   POURBOIRE
   ========================================================= */

.tip-slot{

    display:flex;
    align-items:center;

    height:22px;

    margin-top:4px;
}

.tip-label{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:4px 10px;

    border-radius:999px;

    background:rgba(255,213,74,.12);

    border:1px solid rgba(255,213,74,.45);

    color:#FFD54A;

    font-size:12px;
    font-weight:700;

    box-shadow:
        0 0 10px rgba(255,213,74,.15);
}

.tip-label i{
    font-size:14px;
}


/* =========================================================
   TEXTE
   ========================================================= */

.title{

    display:flex;
    align-items:flex-end;

    min-height:26px;

    font-size:18px;
    font-weight:900;

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px rgba(255,255,255,.75),
        0 0 20px rgba(255,255,255,.35);
}

.sub{

    display:flex;

    align-items:flex-start;

    min-height:22px;

    margin-top:2px;

    color:
        color-mix(
            in srgb,
            var(--cat-color),
            white 30%
        );

    font-weight:700;

    line-height:1.2;

    overflow-wrap:anywhere;

    text-shadow:
        0 0 8px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}


/* =========================================================
   BOUTON APPEL
   ========================================================= */

.call{

    width:52px;
    height:52px;

    min-width:52px;
    min-height:52px;

    flex:0 0 52px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:var(--cat-color);

    color:white;

    font-size:26px;

    text-decoration:none;

    box-shadow:
        0 0 25px var(--cat-color);
}


/* =========================================================
   BOUTON DRAWER
   ========================================================= */

#d-call{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    width:100%;

    height:58px;

    margin:20px 0;

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            color-mix(
                in srgb,
                var(--cat-color),
                white 15%
            ),
            var(--cat-color)
        );

    color:white;

    font-size:17px;

    font-weight:900;

    text-decoration:none;

    box-shadow:

        0 6px 20px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        ),

        0 0 30px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );

    transition:.25s;
}

#d-call:hover{

    transform:translateY(-2px);

    box-shadow:

        0 12px 35px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );
}

#d-call i{
    font-size:22px;
}


/* =========================================================
   DRAWER
   ========================================================= */

.drawer{

    --cat-color:#00a2ff;

    position:fixed;

    top:0;
    right:0;

    height:100%;

    width:min(420px,95vw);

    background:rgba(0,0,0,.9);

    backdrop-filter:blur(20px);

    border-left:2px solid var(--cat-color);

    transform:translateX(100%);

    transition:.3s;

    z-index:999;

    padding:25px;

    overflow:auto;

    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 55%
        );
}

.drawer.show{
    transform:translateX(0);
}


/* =========================================================
   DRAWER TEXTES
   ========================================================= */

.drawer #d-name{

    color:#ffffff;

    text-shadow:
        0 0 5px #ffffff,
        0 0 15px rgba(255,255,255,.75),
        0 0 30px rgba(255,255,255,.35);
}

.drawer #d-cat{

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}

.drawer .info-value{

    color:var(--cat-color);

    text-shadow:
        0 0 12px var(--cat-color);
}


/* =========================================================
   FERMETURE
   ========================================================= */

.close{

    width:52px;
    height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 92%
        );

    color:white;

    font-size:24px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );
}

.close:hover{

    transform:scale(1.08);

    background:var(--cat-color);
}


/* =========================================================
   INFOS
   ========================================================= */

.info{
    margin-top:30px;
}

.info-box{

    padding:18px 0;

    border:none;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    background:none;

    box-shadow:none;

    border-radius:0;
}

.info-box:last-child{
    border-bottom:none;
}

.info-title{

    color:#9db8d7;

    letter-spacing:1px;

    text-transform:uppercase;

    font-size:15px;

    font-weight:700;

    margin-bottom:8px;
}

.info-value{

    color:var(--cat-color);

    font-size:22px;

    font-weight:900;

    text-shadow:
        0 0 12px var(--cat-color);
}


/* =========================================================
   NOM DRAWER
   ========================================================= */

#d-name{

    font-size:36px;

    font-weight:900;

    margin:10px 0 0;

    line-height:1.15;

    text-align:center;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}

#d-cat{

    margin:8px 0 20px;

    font-size:17px;

    font-weight:800;

    text-align:center;

    color:var(--cat-color);

    text-shadow:
        0 0 10px var(--cat-color);
}


/* =========================================================
   LIENS / SERVICES
   ========================================================= */

.info-value a{

    color:var(--cat-color) !important;

    text-decoration:none !important;

    text-shadow:
        0 0 10px color-mix(
            in srgb,
            var(--cat-color),
            transparent 45%
        );
}

#d-services{

    white-space:pre-wrap;

    line-height:1.45;

    font-size:20px;
}

#d-email{

    overflow-wrap:anywhere;

    text-decoration:none !important;

    color:var(--cat-color) !important;

    -webkit-text-decoration:none !important;

    text-decoration-line:none !important;

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;

    user-select:none;
}

#d-address{

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;

    user-select:none;
}


/* =========================================================
   RETOUR
   ========================================================= */

.back-btn{

    width:100%;

    height:58px;

    border:none;

    border-radius:20px;

    background:
        color-mix(
            in srgb,
            var(--cat-color),
            transparent 75%
        );

    border:2px solid var(--cat-color);

    color:white;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    box-shadow:
        0 0 15px color-mix(
            in srgb,
            var(--cat-color),
            transparent 40%
        );

    transition:.2s;
}

.back-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px color-mix(
            in srgb,
            var(--cat-color),
            transparent 20%
        );
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:480px){

    .app{
        padding:15px;
    }

    .card{
        min-height:112px;
        padding:20px;
    }

    .card h3{
        font-size:27px;
    }

    .card > i{
        font-size:40px;
    }

    .lightning-layer{
        border-radius:30px;
    }

}

</style>
</head>

<div class="app">

<script>

/* =========================================================
   COULEURS
   ========================================================= */

const CATEGORY_COLORS = {

    VL:"#2E7DFF",

    PL:"#2E7DFF",

    MOTO:"#2E7DFF",

    LOCATION:"#2E7DFF",

    ASSURANCE:"#2E7DFF",

    GARAGE:"#2E7DFF",

    POLICE:"#00B7FF",

    GENDARMERIE:"#2E7DFF",

    POMPIERS:"#ff1e1e",

    SAMU:"#00bfa5",

    AUTOROUTE:"#ffcc00",

    ADRAH:"#00a2ff"

};


function getCategoryColor(category){

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    return CATEGORY_COLORS[key] || "#00a2ff";
}


function applyCategoryColor(element,category){

    if(!element)
        return;

    const key =
        String(category || "")
        .toUpperCase()
        .trim();

    const color =
        getCategoryColor(key);

    element.style.setProperty(
        "--cat-color",
        color
    );

    element.dataset.cat = key;
}


/* =========================================================
   CATÉGORIES
   ========================================================= */

const CATEGORIES=[

{
    key:"VL",
    label:"VL",
    sub:"Véhicule léger",
    icon:"ph-car"
},

{
    key:"PL",
    label:"PL",
    sub:"Poids lourd",
    icon:"ph-truck"
},

{
    key:"MOTO",
    label:"MOTO",
    sub:"Deux roues",
    icon:"ph-motorcycle"
},

{
    key:"LOCATION",
    label:"LOCATION",
    sub:"Location",
    icon:"ph-key"
},

{
    key:"ASSURANCE",
    label:"ASSURANCE",
    sub:"Assurance",
    icon:"ph-shield"
},

{
    key:"GARAGE",
    label:"GARAGE",
    sub:"Partenaires",
    icon:"ph-wrench"
}

];


const SECRET_CATEGORIES=[

{
    key:"POLICE",
    label:"POLICE",
    sub:"Police Nationale",
    icon:"ph-shield"
},

{
    key:"GENDARMERIE",
    label:"GENDARMERIE",
    sub:"Brigades",
    icon:"ph-shield-star"
},

{
    key:"POMPIERS",
    label:"POMPIERS",
    sub:"SDIS",
    icon:"ph-fire-truck"
},

{
    key:"SAMU",
    label:"SAMU",
    sub:"Urgences",
    icon:"ph-ambulance"
},

{
    key:"AUTOROUTE",
    label:"AUTOROUTE",
    sub:"DIR / PC",
    icon:"ph-road-horizon"
},

{
    key:"ADRAH",
    label:"ADRAH",
    sub:"Numéros utiles",
    icon:"ph-phone-call"
}
];


let DATA=[];

let current=[];

const cats =
    document.getElementById("cats");


/* =========================================================
   ⚡ GÉNÉRATION D'UN ÉCLAIR
   ========================================================= */

/*
   L'éclair ne commence PLUS à l'extérieur de la carte.

   Il est entièrement généré dans la zone intérieure.

   Cela supprime l'effet :
   "rectangle autour de la carte".
*/

function createBoltPath(width,height){

    /*
       Marge de sécurité importante.
    */

    const marginX =
        Math.max(18,width*.08);

    const marginY =
        Math.max(15,height*.12);


    /*
       Zone intérieure disponible.
    */

    const minX=marginX;
    const maxX=width-marginX;

    const minY=marginY;
    const maxY=height-marginY;


    /*
       Point de départ aléatoire.

       Il est toujours DANS la carte.
    */

    let x =
        minX +
        Math.random()*(maxX-minX);

    let y =
        minY +
        Math.random()*(maxY-minY);


    /*
       Point d'arrivée vers le centre.

       Le centre est volontairement privilégié
       pour éviter que les éclairs longent les bords.
    */

    const centerX =
        width*.50;

    const centerY =
        height*.50;


    const targetX =
        centerX +
        (Math.random()-.5) *
        width*.28;

    const targetY =
        centerY +
        (Math.random()-.5) *
        height*.28;


    const points=[];

    points.push([x,y]);


    /*
       4 à 7 segments.

       Cela donne le côté "ricochet".
    */

    const segments =
        4 +
        Math.floor(
            Math.random()*4
        );


    /*
       Direction globale.
    */

    const dx =
        targetX-x;

    const dy =
        targetY-y;


    for(
        let i=1;
        i<=segments;
        i++
    ){

        const progress =
            i/segments;


        let px =
            x +
            dx*progress;

        let py =
            y +
            dy*progress;


        /*
           Chaos variable.

           Plus on approche du centre,
           plus le déplacement devient fin.
        */

        const chaos =
            (1-progress)*28 +
            8;


        px +=
            (Math.random()-.5) *
            chaos;

        py +=
            (Math.random()-.5) *
            chaos;


        /*
           Empêche l'éclair de toucher
           les coins de la carte.
        */

        px =
            Math.max(
                minX,
                Math.min(maxX,px)
            );

        py =
            Math.max(
                minY,
                Math.min(maxY,py)
            );


        points.push([
            px,
            py
        ]);

    }


    /*
       Petit déplacement final
       pour éviter une trajectoire trop parfaite.
    */

    const last =
        points[points.length-1];


    last[0] =
        Math.max(
            minX,
            Math.min(
                maxX,
                last[0] +
                (Math.random()-.5)*12
            )
        );


    last[1] =
        Math.max(
            minY,
            Math.min(
                maxY,
                last[1] +
                (Math.random()-.5)*10
            )
        );


    /*
       Construction du SVG.
    */

    let d=
        "M "
        +
        points[0][0].toFixed(1)
        +
        " "
        +
        points[0][1].toFixed(1);


    for(
        let i=1;
        i<points.length;
        i++
    ){

        d +=
            " L "
            +
            points[i][0].toFixed(1)
            +
            " "
            +
            points[i][1].toFixed(1);

    }


    return {
        d,
        points
    };

}


/* =========================================================
   ⚡ RAMIFICATIONS
   ========================================================= */

function createBranches(
    points,
    width,
    height
){

    let html="";


    /*
       On ne crée pas de branches partout.

       Cela rend l'éclair beaucoup plus naturel.
    */

    for(
        let i=1;
        i<points.length-1;
        i++
    ){

        /*
           Environ 45% des points
           peuvent avoir une branche.
        */

        if(Math.random()>.45)
            continue;


        const [x,y]=points[i];


        /*
           Branche courte.

           Les anciennes branches étaient parfois
           trop longues et pouvaient révéler
           les limites de la carte.
        */

        const length =
            10 +
            Math.random()*28;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const x2 =
            x +
            Math.cos(angle)*length;


        const y2 =
            y +
            Math.sin(angle)*length;


        /*
           Deuxième petit ricochet.
        */

        const length2 =
            5 +
            Math.random()*16;


        const x3 =
            x2 +
            Math.cos(angle +
                (Math.random()-.5)*.9
            ) *
            length2;


        const y3 =
            y2 +
            Math.sin(angle +
                (Math.random()-.5)*.9
            ) *
            length2;


        /*
           Sécurité :
           on garde les branches dans la carte.
        */

        const safeX2 =
            Math.max(
                8,
                Math.min(
                    width-8,
                    x2
                )
            );


        const safeY2 =
            Math.max(
                8,
                Math.min(
                    height-8,
                    y2
                )
            );


        const safeX3 =
            Math.max(
                8,
                Math.min(
                    width-8,
                    x3
                )
            );


        const safeY3 =
            Math.max(
                8,
                Math.min(
                    height-8,
                    y3
                )
            );


        html +=
            `<path
                class="bolt-branch"
                d="
                    M ${x.toFixed(1)} ${y.toFixed(1)}
                    L ${safeX2.toFixed(1)} ${safeY2.toFixed(1)}
                    L ${safeX3.toFixed(1)} ${safeY3.toFixed(1)}
                "
            ></path>`;

    }


    return html;

}


/* =========================================================
   ⚡ CRÉATION DU FLASH
   ========================================================= */

function createLightning(card){

    const layer =
        card.querySelector(
            ".lightning-layer"
        );


    if(!layer)
        return;


    /*
       Taille réelle de la carte.
    */

    const rect =
        card.getBoundingClientRect();


    const width =
        Math.max(
            180,
            rect.width
        );


    const height =
        Math.max(
            90,
            rect.height
        );


    /*
       Génération complètement nouvelle.
    */

    const bolt =
        createBoltPath(
            width,
            height
        );


    const branches =
        createBranches(
            bolt.points,
            width,
            height
        );


    /*
       SVG.
    */

    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.setAttribute(
        "class",
        "dynamic-lightning lightning-flash"
    );


    svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
    );


    svg.setAttribute(
        "preserveAspectRatio",
        "none"
    );


    /*
       Flash volontairement variable.

       Plus lent que l'ancien.
    */

    const flashTime =
        420 +
        Math.random()*420;


    svg.style.setProperty(
        "--flash-time",
        `${flashTime}ms`
    );


    /*
       HALO.
    */

    const halo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    halo.setAttribute(
        "class",
        "bolt-halo"
    );


    halo.setAttribute(
        "d",
        bolt.d
    );


    /*
       GLOW.
    */

    const glow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    glow.setAttribute(
        "class",
        "bolt-glow"
    );


    glow.setAttribute(
        "d",
        bolt.d
    );


    /*
       RAMIFICATIONS.
    */

    const branchGroup =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    branchGroup.innerHTML=
        branches;


    /*
       CŒUR BLANC.
    */

    const core =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    core.setAttribute(
        "class",
        "bolt-core"
    );


    core.setAttribute(
        "d",
        bolt.d
    );


    /*
       Ordre :
       halo
       glow
       branches
       cœur
    */

    svg.appendChild(halo);

    svg.appendChild(glow);

    svg.appendChild(branchGroup);

    svg.appendChild(core);


    layer.appendChild(svg);


    /*
       Suppression.
    */

    setTimeout(()=>{

        if(svg.parentNode)
            svg.remove();

    },flashTime+80);

}


/* =========================================================
   ⚡ BOUCLE ALÉATOIRE
   ========================================================= */

function startLightning(card){

    /*
       Empêche de lancer deux boucles
       sur la même carte.
    */

    if(card.dataset.lightningStarted==="1")
        return;


    card.dataset.lightningStarted="1";


    function nextFlash(){

        if(!document.body.contains(card)){

            card.dataset.lightningStarted="0";

            return;

        }


        /*
           Pause aléatoire.

           Le but :
           ne PAS donner l'impression
           d'une animation en boucle.

           Certains éclairs arrivent vite,
           d'autres beaucoup plus tard.
        */

        const delay =
            900 +
            Math.random()*2600;


        setTimeout(()=>{

            if(!document.body.contains(card))
                return;


            createLightning(card);


            nextFlash();

        },delay);

    }


    /*
       Chaque carte commence à un moment
       différent.
    */

    setTimeout(
        nextFlash,
        400 +
        Math.random()*3000
    );

}

/* =========================================================
   NORMALISATION
   ========================================================= */

function normalize(text){

    return String(text ?? "")

        .toLocaleLowerCase(
            "fr-FR"
        )

        .normalize("NFKD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[’']/g,
            ""
        )

        .replace(
            /[-_]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   RECHERCHE
   ========================================================= */

function search(text){

    const n=
        normalize(text);


    if(!n){

        results.classList.remove(
            "show"
        );


        setTimeout(()=>{

            results.style.display="none";

        },300);


        backBox.style.display="none";

        return;

    }


    const words=
        n.split(" ")
        .filter(Boolean);


    let rows=

        DATA

        .map(item=>{

            const name=
                normalize(item.name);

            const phone=
                normalize(item.phone);

            const category=
                normalize(item.category);

            const type=
                normalize(item.type);

            const assistant=
                normalize(item.assistant);

            const services=
                normalize(item.services);

            const country=
                normalize(item.pays);


            const searchable=[

                name,
                phone,
                category,
                type,
                assistant,
                services,
                country

            ].join(" ");


            const searchableCompact=
                searchable.replace(
                    /\s/g,
                    ""
                );


            const matches=
                words.every(word=>

                    searchable.includes(
                        word
                    )

                    ||

                    searchableCompact.includes(
                        word.replace(
                            /\s/g,
                            ""
                        )
                    )

                );


            if(!matches)
                return null;


            let score=0;


            words.forEach(word=>{

                if(name===word)
                    score+=100;

                else if(
                    name.startsWith(word)
                )
                    score+=70;

                else if(
                    name.includes(word)
                )
                    score+=50;


                if(category===word)
                    score+=40;

                else if(
                    category.includes(word)
                )
                    score+=25;


                if(type.includes(word))
                    score+=20;


                if(
                    assistant.includes(word)
                )
                    score+=15;


                if(
                    services.includes(word)
                )
                    score+=10;


                if(phone.includes(word))
                    score+=10;

            });


            return {
                item,
                score
            };

        })

        .filter(Boolean);


    rows.sort((a,b)=>{

        if(b.score!==a.score)
            return b.score-a.score;


        return a.item.name.localeCompare(
            b.item.name,
            "fr",
            {
                sensitivity:"base"
            }
        );

    });


    rows=
        rows.map(x=>x.item);


    render(rows);

}

    e=>{
        search(e.target.value);
    }
);

                return;


            try{

                await navigator.clipboard
                    .writeText(
                        item.email
                    );


                const old=
                    email.textContent;


                email.textContent=
                    "✓ Copié";


                setTimeout(()=>{

                    email.textContent=
                        old;

                },1200);

            }

            catch(e){

                console.warn(
                    "Copie impossible :",
                    e
                );

            }

        };


        /* =================================================
           SERVICES
           ================================================= */

        document.getElementById(
            "d-services"
        ).textContent=
            item.services;


        /* =================================================
           OUVERTURE
           ================================================= */

        drawer.classList.add(
            "show"
        );

    }
);


/* =========================================================
   FERMETURE DRAWER
   ========================================================= */

document.getElementById(
    "closeDrawer"
).onclick=()=>{

    drawer.classList.remove(
        "show"
    );

};


/* =========================================================
   RETOUR
   ========================================================= */

backBtn.onclick=()=>{

    q.value="";


    results.classList.remove(
        "show"
    );


    setTimeout(()=>{

        results.style.display="none";

    },300);


    backBox.style.display="none";


    list.innerHTML="";


    cats.style.display="grid";


    results.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );


    backBtn.style.setProperty(
        "--cat-color",
        "#00a2ff"
    );


    /*
       IMPORTANT :
       On recrée les cartes afin que
       leur système d'éclairs reparte proprement.
    */

    renderCategories(
        secretMode
        ? SECRET_CATEGORIES
        : CATEGORIES
    );


    setTimeout(()=>{

        cats.classList.remove(
            "hide"
        );

    },20);


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};

</script>

</div>
