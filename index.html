<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ADRAH — Assistance • Dépannage • Remorquage</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">


<style>


:root{

--blue:#005BFF;

--cyan:#00a2ff;

--glass:rgba(0,0,0,.55);

}



*{

box-sizing:border-box;

}



body{

margin:0;

min-height:100vh;

font-family:Inter,sans-serif;

color:white;

background:#05070b;

overflow-x:hidden;

}


body::before{

content:"";

position:fixed;

top:0;
left:0;
right:0;
bottom:0;

background:

linear-gradient(
rgba(0,0,0,.35),
rgba(0,10,30,.55)
),

url("fond-adrah.PNG");


background-position:center;

background-size:cover;

background-repeat:no-repeat;


z-index:0;

pointer-events:none;

}


.app{

position:relative;

z-index:1;

max-width:560px;

margin:auto;

padding:20px;

}



/* RECHERCHE */


.search input{

width:100%;

height:62px;


border-radius:22px;


border:2px solid var(--blue);


background:rgba(0,0,0,.6);


color:white;


font-size:18px;

font-weight:900;

text-align:center;


box-shadow:

0 0 10px var(--blue),

0 0 35px rgba(0,91,255,.6);



}


.search input::placeholder{

color:#9ed2ff;

}



/* TITRE */


h2{

font-size:15px;

color:#00a2ff;


text-shadow:

0 0 10px #005BFF;


}



/* GRILLE */


.grid{

display:grid;

gap:16px;

transition:.35s ease;

opacity:1;

transform:translateX(0);

}

/* Animation de la grille */

.grid.hide{

opacity:0;

transform:translateX(-60px) scale(.96);

pointer-events:none;

}

/* Animation des résultats */

#results{

transition:.35s ease;

opacity:0;

transform:translateX(60px);

}

#results.show{

opacity:1;

transform:translateX(0);

}


/* CARTES */


.card{

    
position:relative;


display:flex;

align-items:center;

    
gap:20px;


padding:22px;


min-height:120px;


border-radius:30px;



background:

linear-gradient(

135deg,

rgba(0,91,255,.2),

rgba(0,0,0,.65)

);



border:

1px solid rgba(0,162,255,.8);



backdrop-filter:blur(15px);



box-shadow:

0 0 15px rgba(0,91,255,.7),

0 0 40px rgba(0,91,255,.35),

inset 0 0 25px rgba(0,91,255,.15);



transition:.25s;


}


.card:hover{

transform:translateY(-4px);

}

/* COULEURS MENU SECRET */

.card[data-cat="POLICE"]{
    --cat-color:#00B7FF;
}

.card[data-cat="GENDARMERIE"]{
    --cat-color:#2E7DFF;
}

.card[data-cat="POMPIERS"]{
    --cat-color:#ff1e1e;
}

.card[data-cat="SAMU"]{
    --cat-color:#00bfa5;
}

.card[data-cat="AUTOROUTE"]{
    --cat-color:#ffcc00;
}

.card[data-cat="ADRAH"]{
    --cat-color:#00a2ff;
}

/* Couleur des résultats selon catégorie */

#list[data-cat="POLICE"] .row{
    border-color:#00B7FF;
    box-shadow:
    0 0 20px #00B7FF;
}

#list[data-cat="GENDARMERIE"] .row{
    border-color:#2E7DFF;
    box-shadow:
    0 0 20px #2E7DFF;
}

#list[data-cat="POMPIERS"] .row{
    border-color:#ff1e1e;
    box-shadow:
    0 0 20px #ff1e1e;
}

#list[data-cat="SAMU"] .row{
    border-color:#00bfa5;
    box-shadow:
    0 0 20px #00bfa5;
}

#list[data-cat="AUTOROUTE"] .row{
    border-color:#ffcc00;
    box-shadow:
    0 0 20px #ffcc00;
}

#list[data-cat="ADRAH"] .row{
    border-color:#00a2ff;
    box-shadow:
    0 0 20px #00a2ff;
}


/* COULEUR DES RESULTATS MENU SECRET */

#list[data-cat="POLICE"] .title,
#list[data-cat="POLICE"] .sub{
    color:#00B7FF;
    text-shadow:
    0 0 10px #00B7FF;
}


#list[data-cat="GENDARMERIE"] .title,
#list[data-cat="GENDARMERIE"] .sub{
    color:#2E7DFF;
    text-shadow:
    0 0 10px #2E7DFF;
}


#list[data-cat="POMPIERS"] .title,
#list[data-cat="POMPIERS"] .sub{
    color:#ff1e1e;
    text-shadow:
    0 0 10px #ff1e1e;
}


#list[data-cat="SAMU"] .title,
#list[data-cat="SAMU"] .sub{
    color:#00bfa5;
    text-shadow:
    0 0 10px #00bfa5;
}


#list[data-cat="AUTOROUTE"] .title,
#list[data-cat="AUTOROUTE"] .sub{
    color:#ffcc00;
    text-shadow:
    0 0 10px #ffcc00;
}


#list[data-cat="ADRAH"] .title,
#list[data-cat="ADRAH"] .sub{
    color:#00a2ff;
    text-shadow:
    0 0 10px #00a2ff;
}   

/* Halo personnalisé */

/* UNIQUEMENT LE MENU SECRET */

.card[data-cat="POLICE"],
.card[data-cat="GENDARMERIE"],
.card[data-cat="POMPIERS"],
.card[data-cat="SAMU"],
.card[data-cat="AUTOROUTE"],
.card[data-cat="ADRAH"]{

    border-color:var(--cat-color);

    box-shadow:
    0 0 15px var(--cat-color),
    0 0 40px color-mix(in srgb, var(--cat-color), transparent 40%),
    inset 0 0 25px color-mix(in srgb, var(--cat-color), transparent 75%);

}


.card[data-cat="POLICE"] i,
.card[data-cat="POLICE"] h3,
.card[data-cat="GENDARMERIE"] i,
.card[data-cat="GENDARMERIE"] h3,
.card[data-cat="POMPIERS"] i,
.card[data-cat="POMPIERS"] h3,
.card[data-cat="SAMU"] i,
.card[data-cat="SAMU"] h3,
.card[data-cat="AUTOROUTE"] i,
.card[data-cat="AUTOROUTE"] h3,
.card[data-cat="ADRAH"] i,
.card[data-cat="ADRAH"] h3{

    text-shadow:
    0 0 5px white,
    0 0 15px var(--cat-color),
    0 0 35px var(--cat-color);

}


.card i{


font-size:45px;


color:white;


text-shadow:

0 0 5px white,

0 0 15px #00a2ff,

0 0 35px #005BFF;


}



.card h3{


margin:0;


font-size:34px;


font-weight:900;

    
text-shadow:

0 0 5px white,

0 0 15px #00a2ff,

0 0 35px #005BFF;


}



.card[data-cat="POLICE"] span,
.card[data-cat="GENDARMERIE"] span,
.card[data-cat="POMPIERS"] span,
.card[data-cat="SAMU"] span,
.card[data-cat="AUTOROUTE"] span,
.card[data-cat="ADRAH"] span{

color:var(--cat-color);

text-shadow:
0 0 10px var(--cat-color);

}




/* RESULTATS */


#results{

margin-top:25px;

}



.row{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;

    padding:16px 18px;

    min-height:95px;

    margin-bottom:15px;

    border-radius:25px;

    background:rgba(0,0,0,.55);

    border:1px solid #005BFF;

    box-shadow:
        0 0 20px rgba(0,91,255,.5);
}
    
.row > div:first-child{
    flex:1;
    min-width:0;
}
    
.tip-slot{
    display:flex;
    align-items:center;

    height:22px;

    margin-top:4px;
}

.tip-label{
    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:4px 10px;

    border-radius:999px;

    background:rgba(255,213,74,.12);
    border:1px solid rgba(255,213,74,.45);

    color:#FFD54A;

    font-size:12px;
    font-weight:700;

    box-shadow:
        0 0 10px rgba(255,213,74,.15);
}

.tip-label i{
    font-size:14px;
}

.title{
    display:flex;
    align-items:flex-end;

    min-height:26px;

    font-size:18px;
    font-weight:900;

    text-shadow:
        0 0 15px #005BFF;
}


.sub{
    display:flex;
    align-items:flex-start;

    min-height:22px;

    margin-top:2px;

    color:#8fd3ff;

    font-weight:700;

    line-height:1.2;

    overflow-wrap:anywhere;
}



.call{

    width:52px;

    height:52px;

    min-width:52px;

    min-height:52px;

    flex:0 0 52px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#005BFF;

    color:white;

    font-size:26px;

    text-decoration:none;

    box-shadow:
        0 0 25px #005BFF;
}

#d-call{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    width:100%;

    height:58px;

    margin:20px 0;

    border-radius:22px;

    background:
    linear-gradient(
        180deg,
        #1673ff,
        #005BFF
    );

    color:white;

    font-size:17px;

    font-weight:900;

    text-decoration:none;

    box-shadow:
        0 6px 20px rgba(0,91,255,.45),
        0 0 25px rgba(0,91,255,.25);

    transition:.25s;

}


#d-call:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 35px rgba(0,91,255,.6);

}


#d-call i{

    font-size:22px;

}
    
.info-value a{
    color:#00a2ff;
    text-decoration:underline;

    text-shadow:
        0 0 10px rgba(0,162,255,.45);
}

#d-services{
    white-space:pre-wrap;
    line-height:1.45;
    font-size:20px;
}

#d-email{
    overflow-wrap:anywhere;
} 
    
.back-btn{

width:100%;

height:58px;

border:none;

border-radius:20px;

background:rgba(0,91,255,.25);

border:2px solid #005BFF;

color:white;

font-size:18px;

font-weight:900;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

gap:12px;

box-shadow:
0 0 15px rgba(0,91,255,.6);

transition:.2s;

}

.back-btn:hover{

transform:translateY(-2px);

box-shadow:
0 0 25px rgba(0,91,255,.8);

}

/* DRAWER */


.drawer{


position:fixed;


top:0;

right:0;


height:100%;


width:min(420px,95vw);


background:rgba(0,0,0,.9);


backdrop-filter:blur(20px);


border-left:2px solid #005BFF;


transform:translateX(100%);


transition:.3s;


z-index:999;


padding:25px;


overflow:auto;


}



.drawer.show{

transform:translateX(0);

}


.close{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:24px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 15px rgba(0,91,255,.25);
}

.close:hover{
    transform:scale(1.08);
    background:#005BFF;
}


/* ---------- Cartes d'informations ---------- */

.info{
    margin-top:30px;
}

.info-box{
    padding:18px 0;
    border:none;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:none;
    box-shadow:none;
    border-radius:0;
}

.info-box:last-child{
    border-bottom:none;
}

.info-title{
    color:#9db8d7;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:15px;
    font-weight:700;
    margin-bottom:8px;
}

.info-value{
    color:#00a2ff;
    font-size:22px;
    font-weight:900;
    text-shadow:
        0 0 12px rgba(0,162,255,.45);
}

#d-name{
    font-size:36px;
    font-weight:900;
    margin:10px 0 0;
    line-height:1.15;
    text-align:center;

    text-shadow:
        0 0 10px #005BFF;
}

#d-cat{
    margin:8px 0 20px;
    font-size:17px;
    font-weight:800;
    text-align:center;
    color:#00a2ff;

    text-shadow:
        0 0 10px rgba(0,162,255,.45);    
}
    
/* Décale légèrement uniquement les cartes du menu secret */
.grid.secret-mode .card{
    transform:translateX(-12px);
}

.grid.secret-mode .card:hover{
    transform:translateX(-12px) translateY(-4px);
} 
    
</style>


</head>


<body>


<div class="app">





<div class="search">

<input id="q" placeholder="Rechercher...">

</div>



<h2 id="secretTrigger">

CATÉGORIES

</h2>



<div class="grid" id="cats"></div>

<section id="results" style="display:none">

<div id="backBox" style="display:none; margin:20px 0;">
    <button id="backBtn" class="back-btn">
        <i class="ph ph-arrow-left"></i>
        Retour aux catégories
    </button>
</div>


<h2 id="count"></h2>


<div id="list"></div>


</section>

  <!-- DRAWER DETAIL -->

<aside id="drawer" class="drawer">

<button class="close" id="closeDrawer">
    <i class="ph ph-arrow-left"></i>
</button>



<h1 id="d-name"></h1>

<h3 id="d-cat"></h3>


<a id="d-call" class="call">


<span id="d-tel"></span>

</a>



<div class="info">


<div id="typeBox" class="info-box">

<div class="info-title">
 Type
</div>

<div id="d-type" class="info-value"></div>

</div>


<div id="assistBox" class="info-box">

<div class="info-title">
 Assisteur
</div>

<div id="d-assist" class="info-value"></div>

</div>

<div id="countryBox" class="info-box">

<div class="info-title">
 Pays
</div>

<div id="d-country" class="info-value"></div>

</div>
    
<div id="availableBox" class="info-box">

<div class="info-title">
 Disponibilité
</div>

<div class="info-value">
24h/24 • 7j/7
</div>

</div>
    
<div id="addressBox" class="info-box">
    <div class="info-title">Adresse</div>
    <div class="info-value">
        <a id="d-address" target="_blank"></a>
    </div>
</div>

<div id="emailBox" class="info-box">
    <div class="info-title">Email</div>
    <div class="info-value" id="d-email"></div>
</div>

<div id="servicesBox" class="info-box">
    <div class="info-title">Services</div>
    <div class="info-value" id="d-services"></div>
</div>

</div>


</aside>



<script>


const CATEGORIES=[

{
key:"VL",
label:"VL",
sub:"Véhicule léger",
icon:"ph-car"
},

{
key:"PL",
label:"PL",
sub:"Poids lourd",
icon:"ph-truck"
},

{
key:"MOTO",
label:"MOTO",
sub:"Deux roues",
icon:"ph-motorcycle"
},

{
key:"LOCATION",
label:"LOCATION",
sub:"Location",
icon:"ph-key"
},

{
key:"ASSURANCE",
label:"ASSURANCE",
sub:"Assurance",
icon:"ph-shield"
},

{
key:"GARAGE",
label:"GARAGE",
sub:"Partenaires",
icon:"ph-wrench"
}

];

const SECRET_CATEGORIES = [

{
key:"POLICE",
label:"POLICE",
sub:"Police Nationale",
icon:"ph-shield"
},

{
key:"GENDARMERIE",
label:"GENDARMERIE",
sub:"Brigades",
icon:"ph-shield-star"
},

{
key:"POMPIERS",
label:"POMPIERS",
sub:"SDIS",
icon:"ph-fire-truck"
},

{
key:"SAMU",
label:"SAMU",
sub:"Urgences",
icon:"ph-ambulance"
},

{
key:"AUTOROUTE",
label:"AUTOROUTE",
sub:"DIR / PC",
icon:"ph-road-horizon"
},

{
key:"ADRAH",
label:"ADRAH",
sub:"Numéros utiles",
icon:"ph-phone-call"
}

];

let DATA=[];

let current=[];



const cats=document.getElementById("cats");



function renderCategories(data){

    cats.innerHTML = data.map(c=>`

    <div class="card" data-cat="${c.key}">

        <i class="ph ${c.icon}"></i>

        <div>
            <h3>${c.label}</h3>
            <span>${c.sub}</span>
        </div>

    </div>

    `).join("");

}

renderCategories(CATEGORIES);



let secretClicks = 0;
let secretMode = false;

const secretTrigger = document.getElementById("secretTrigger");

secretTrigger.onclick = ()=>{

    secretClicks++;

    setTimeout(()=>{

        secretClicks=0;

    },1200);

    if(secretClicks>=3){

    secretClicks = 0;

    secretMode = !secretMode;

    // Active ou désactive le décalage
    if(secretMode){
        cats.classList.add("secret-mode");
    }else{
        cats.classList.remove("secret-mode");
    }

    cats.classList.add("hide");

    setTimeout(()=>{

        renderCategories(
            secretMode
                ? SECRET_CATEGORIES
                : CATEGORIES
        );

        cats.classList.remove("hide");

    },300);

}

};


/* CHARGEMENT DES JSON */


Promise.allSettled([

fetch("data.json").then(r=>r.json()),

fetch("data2.json").then(r=>r.json()),

fetch("data3.json").then(r=>r.json()),

fetch("garage.json").then(r=>r.json()),
    
fetch("adrah.json").then(r=>r.json()),
    
fetch("police.json").then(r=>r.json()),
    
fetch("gendarmerie.json").then(r=>r.json()),
    
fetch("autoroute.json").then(r=>r.json()),
    
fetch("pompier.json").then(r=>r.json()),
    
fetch("samu.json").then(r=>r.json())
    
])


.then(r=>{


DATA=[

...(r[0].value || []),

...(r[1].value || []),

...(r[2].value || []),

...(r[3].value || []),
    
...(r[4].value || []),
    
...(r[5].value || []),
    
...(r[6].value || []),    
    
...(r[7].value || []),

...(r[8].value || []),
    
...(r[9].value || [])
    
];


DATA=DATA.map(x=>({

name:(x.nom || x.name || "").trim(),

phone:String(
x.telephone || x.phone || ""
),

category:
String(
    x.categorie ||
    x.category ||
    x.type ||
    x.famille ||
    x.service ||
    ""
)
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "")
.trim()
.toUpperCase(),
    
pays: String(x.pays || "")
.trim()
.toUpperCase(),
  
type: String(
    x.type ?? ""
).trim(),


assistant: String(
    x.assisteur ??
    x.assistant ??
    ""
).trim(),



email:
x.email ||
x.mail ||
x.Email ||
x["e-mail"] ||
"",



services:x.services || "",

adresse:
x.adresse ||
x.address ||
"",
    
pourboire: x.pourboire === true,
    
logo:x.logo || ""

}));

DATA.sort((a,b)=>{

    if(a.pays==="FR" && b.pays!=="FR") return -1;

    if(a.pays!=="FR" && b.pays==="FR") return 1;

    return a.name.localeCompare(
        b.name,
        "fr",
        {
            sensitivity:"base"
        }
    );

});
  
console.log(DATA);


});





/* RECHERCHE */


const q=document.getElementById("q");

const results=document.getElementById("results");

const list=document.getElementById("list");

const count=document.getElementById("count");

const backBox = document.getElementById("backBox");
  
const backBtn = document.getElementById("backBtn");


function render(rows, category=""){

current=rows;

list.dataset.cat = category;


if(!rows.length){

    results.style.display = "block";
    results.classList.add("show");

    backBox.style.display = "block";

    count.textContent = "0 résultat";

    list.innerHTML = `
        <div class="row">
            <div>
                <div class="title">Aucun résultat</div>
                <div class="sub">Cette catégorie est vide.</div>
            </div>
        </div>
    `;

    return;
}


results.style.display = "block";
results.classList.add("show");
backBox.style.display = "block";

count.textContent=

rows.length+

" résultat(s)";



list.innerHTML = rows.map((r,i)=>`

<div class="row" data-i="${i}">

    <div>

        <div class="title">
            ${r.name}
        </div>

        <div class="sub">
            ${r.category}
            ${
                r.category !== "GARAGE"
                ? " · " + r.assistant
                : ""
            }
        </div>

        <div class="tip-slot">
            ${
                r.category === "GARAGE" && r.pourboire
                ? `
                <div class="tip-label">
                    <i class="ph ph-coins"></i>
                    Pourboire
                </div>
                `
                : ""
            }
        </div>

    </div>

    <a class="call" href="tel:${r.phone}">
        <i class="ph ph-phone"></i>
    </a>

</div>

`).join("");
  

setTimeout(()=>{

results.scrollIntoView({

behavior:"smooth",

block:"start"

});

},100);

}


function search(text){


let n=text.toLowerCase().trim();



if(!n){

    results.classList.remove("show");

    setTimeout(() => {
        results.style.display = "none";
    },300);

    backBox.style.display = "none";

    return;

}



let rows=DATA.filter(x=>{


return [

x.name,

x.phone,

x.category,

x.type,

x.assistant,

x.services

]

.join(" ")

.toLowerCase()

.includes(n);

});



render(rows);


}



q.addEventListener("input",e=>{

search(e.target.value);

});






/* CLIC CATEGORIES */


cats.addEventListener("click",e=>{

    const card=e.target.closest(".card");
    if(!card) return;

    const key=card.dataset.cat;

    let rows;

    if(key==="ASSURANCE"){

        rows=DATA.filter(x=>

            x.category.includes("ASSUR") ||

            x.category.includes("COURT") ||

            x.type.toUpperCase().includes("ASSUR") ||

            x.assistant.toUpperCase().includes("ASSUR")

        );

    }else{

        rows=DATA.filter(x=>x.category===key);

    }

    // Tri
    rows.sort((a,b)=>{

        if(a.pays==="FR" && b.pays!=="FR") return -1;
        if(a.pays!=="FR" && b.pays==="FR") return 1;

        return a.name.localeCompare(
            b.name,
            "fr",
            { sensitivity:"base" }
        );

    });

    cats.classList.add("hide");

    setTimeout(()=>{

        cats.style.display="none";

        render(rows, key);

        results.classList.add("show");

    },300);

});



/* DRAWER */


const drawer=document.getElementById("drawer");



list.addEventListener("click",e=>{


if(e.target.closest(".call"))

return;



let row=e.target.closest(".row");


if(!row)return;



let item=current[row.dataset.i];



document.getElementById("d-name").textContent=item.name;


document.getElementById("d-cat").textContent=item.category;

document.getElementById("d-call").href=

"tel:"+item.phone;



document.getElementById("d-type").textContent=item.type;

document.getElementById("d-assist").textContent=item.assistant;

document.getElementById("d-country").textContent = item.pays;
    
const typeBox = document.getElementById("typeBox");
const assistBox = document.getElementById("assistBox");
const addressBox = document.getElementById("addressBox");
const emailBox = document.getElementById("emailBox");
const servicesBox = document.getElementById("servicesBox");
const countryBox = document.getElementById("countryBox");
const availableBox = document.getElementById("availableBox");
    
// AFFICHAGE SELON CATEGORIE

typeBox.style.display = "block";
assistBox.style.display = "block";
addressBox.style.display = "none";
emailBox.style.display = "none";
servicesBox.style.display = "none";

if (item.category === "GARAGE") {

    assistBox.style.display = "none";

    emailBox.style.display = "none";
    servicesBox.style.display = "none";

}


const address = document.getElementById("d-address");

if(item.adresse){

address.href =
"https://maps.apple.com/?q=" +
encodeURIComponent(item.adresse);

address.style.color="#00a2ff";
address.style.textDecoration="underline";

}else{

address.removeAttribute("href");

}


const email = document.getElementById("d-email");

email.textContent = item.email || "—";

email.onclick = async ()=>{

    if(!item.email) return;

    await navigator.clipboard.writeText(item.email);

    const old=email.textContent;

    email.textContent="✓ Copié";

    setTimeout(()=>{
        email.textContent=old;
    },1200);

};


document.getElementById("d-services").textContent=item.services;





drawer.classList.add("show");


});





document.getElementById("closeDrawer")

.onclick=()=>{

drawer.classList.remove("show");

};

backBtn.onclick = () => {

    q.value = "";

    results.classList.remove("show");

    setTimeout(() => {

        results.style.display = "none";

    },300);

    backBox.style.display = "none";

    list.innerHTML = "";

    setTimeout(() => {

        cats.classList.remove("hide");

    },20);

        top:0,
        behavior:"smooth"
    });

};
